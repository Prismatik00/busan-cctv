<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 CCTV 모아보기</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#272b35; --text:#e7e9ee; --muted:#8b91a0; --accent:#3d7bfd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tabs button { flex:1; padding:7px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #map { flex:1; min-height:300px; display:none; }
  #map.show { display:block; }
  #list.hide { display:none; }
  .leaflet-tooltip { font-size:12px; }
  .nat-hint { background:rgba(23,26,33,.85); color:#fff; font-size:11px; padding:5px 8px; border-radius:6px; }
  .pv { position:fixed; z-index:1300; width:260px; background:#171a21; color:#e7e9ee; border:1px solid #2c3240; border-radius:10px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.5); cursor:pointer; }
  .pv-x { float:right; color:#aaa; padding:0 4px; cursor:pointer; }
  .pv-name { font-size:13px; font-weight:600; margin:0 2px 6px 2px; }
  .pv-vid { position:relative; background:#000; border-radius:6px; overflow:hidden; cursor:zoom-in; }
  .pv-vid::after { content:'⤢ 크게 보기'; position:absolute; right:6px; bottom:6px; font-size:11px; background:rgba(0,0,0,.6); color:#fff; padding:2px 6px; border-radius:6px; }
  .pv { cursor:default; }
  .pv-vid video { width:100%; aspect-ratio:16/9; object-fit:fill; display:block; }
  .pv-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8b91a0; font-size:12px; }
  .pv-btn { width:100%; margin-top:6px; background:#3d7bfd; border-color:#3d7bfd; color:#fff; font-size:12px; padding:6px; }
  .pv-btn.on { background:#2a2f3a; border-color:#3a4050; color:#ffb0b0; }
  .preset { display:inline-flex; gap:0; }
  .preset select { border-radius:8px 0 0 8px; max-width:180px; }
  .preset button { border-radius:0 8px 8px 0; border-left:none; color:#ff8a8a; }
  .preset button:disabled { color:var(--muted); opacity:.5; cursor:default; }
  #qrBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2600; }
  #qrBox.show { display:flex; }
  #qrBox .box { background:var(--panel); padding:18px; border-radius:12px; width:min(360px,92vw); text-align:center; }
  #qrBox p { margin:0 0 10px; font-size:14px; }
  #qrImg { background:#fff; border-radius:8px; padding:10px; display:inline-block; }
  #qrImg img, #qrImg svg { display:block; width:260px; height:260px; max-width:70vw; max-height:70vw; }
  #qrLink { width:100%; margin-top:10px; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--muted); font-size:11px; }
  #qrBox .btns { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  #dlg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2600; }
  #dlg.show { display:flex; }
  #dlg .box { background:var(--panel); padding:18px; border-radius:12px; width:min(380px,90vw); }
  #dlg p { margin:0 0 10px; font-size:14px; }
  #dlg #dlgNote { font-size:12px; color:#ffb35c; min-height:16px; margin:8px 0 0; }
  #dlg input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:15px; }
  #dlg .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  #exportBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2000; }
  #exportBox.show { display:flex; }
  #exportBox div { background:var(--panel); padding:16px; border-radius:10px; width:min(520px,92vw); }
  #exportBox textarea { width:100%; height:180px; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
  aside { width:380px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside header { padding:14px 14px 8px; }
  h1 { font-size:16px; margin:0 0 10px; }
  input[type=search] { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:14px; }
  .hint { font-size:12px; color:var(--muted); margin:8px 0 0; }
  #list { overflow:auto; flex:1; padding:4px 6px 10px; }
  .item { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px; }
  .item:hover { background:#1f2330; }
  .item input { margin-top:2px; }
  .item .name { flex:1; min-width:0; }
  .item.sel { background:#1a2236; margin-bottom:3px; cursor:grab; }
  .item .num { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .item.sel { cursor:default; }
  .item .handle { flex:none; align-self:center; font-size:20px; line-height:1; padding:6px 10px; margin:-6px -4px -6px 0; color:var(--muted);
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; border-radius:6px; }
  .item .handle:hover { color:var(--text); background:#263049; }
  #list { position:relative; }
  .item.placeholder { background:transparent; outline:2px dashed #3d7bfd; outline-offset:-2px; }
  .item.placeholder > * { visibility:hidden; }
  .item.ghost { position:fixed; z-index:2500; margin:0; pointer-events:none; opacity:.85; background:#2a3a63;
    box-shadow:0 10px 28px rgba(0,0,0,.55); transform:scale(1.02); cursor:grabbing; }
  .item.ghost .handle { color:#fff; }
  body.dragging-list, body.dragging-list * { cursor:grabbing !important; user-select:none; }
  .sect { font-size:11px; color:var(--muted); margin:10px 8px 6px; }
  .item small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .toolbar label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  select, button { background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover { filter:brightness(1.15); }
  #status { font-size:12px; color:var(--muted); margin-left:auto; }
  /* 카드는 원래 비율(4:3) 크기를 유지하고, 넘치면 모아보기 영역이 스크롤됨 */
  #grid { flex:1; min-height:0; overflow-y:auto; padding:12px; display:grid; gap:10px; align-content:start; grid-auto-rows:max-content; }
  /* 카드: 영상 영역은 남는 공간에 맞춰 줄어들며 가장자리를 잘라 채우고(cover), 아래 이름·버튼 줄은 항상 그대로 */
  .tile { background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; min-height:0; }
  /* 부산 CCTV는 대부분 16:9 화면을 4:3·3:2(320x240, 720x480 등)로 눌러 보내므로 16:9로 펼쳐서 보여줌 */
  .tile video { width:100%; aspect-ratio:16/9; flex:none; height:auto; display:block; background:#000; object-fit:fill; }
  .tile .bar { flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--panel); font-size:13px; }
  .tile .bar span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .bar button { flex:none; padding:4px 8px; font-size:12px; }
  .tile .bar span { min-width:0; }
  .tile .msg { position:absolute; inset:0 0 34px 0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; pointer-events:none; }
  .empty { color:var(--muted); font-size:14px; padding:40px; text-align:center; grid-column:1/-1; }
  .tile.dragging { opacity:.4; }
  .tile video { cursor:zoom-in; }
  .tile.big { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1500; display:flex; flex-direction:column;
    width:min(92vw, calc((92vh - 44px) * 16 / 9)); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .tile.big video { cursor:zoom-out; }
  .tile.big .bar { font-size:15px; }
  #backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:1400; }
  #backdrop.show { display:block; }
  .navbtn { display:none; position:fixed; top:50%; transform:translateY(-50%); z-index:1600; width:52px; height:80px; border:none; border-radius:10px;
    background:rgba(20,22,30,.7); color:#fff; font-size:34px; line-height:80px; padding:0; cursor:pointer; }
  .navbtn:hover { background:rgba(61,123,253,.85); }
  .navbtn.show { display:block; }
  #navPrev { left:max(4px, calc(4vw - 56px)); }
  #navNext { right:max(4px, calc(4vw - 56px)); }
  #navCount { display:none; position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:1600; color:#fff; font-size:13px; background:rgba(20,22,30,.7); padding:3px 10px; border-radius:10px; }
  #navCount.show { display:block; }
  #toast { z-index:3000; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#222838; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  @media (max-width:760px){
    body{flex-direction:column;height:auto;overflow:auto}
    aside{width:100% !important;max-height:none}
    #map{flex:none;height:45vh;min-height:240px}
    #list{flex:none;max-height:45vh}
    #wide{display:none}
    main{min-height:60vh}
    #grid{overflow:visible}
    .navbtn{width:40px;height:64px;line-height:64px;font-size:28px}
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>부산 CCTV 모아보기</h1>
    <input id="q" type="search" placeholder="장소·주소 검색 (예: 서면, 해운대, 남천동)">
    <p class="hint" id="count">CCTV 목록 불러오는 중…</p>
    <div class="tabs"><button id="tabMap" class="on">지도</button><button id="tabList">목록</button><button id="wide" title="왼쪽 영역 넓히기/줄이기">지도 크게</button></div>
  </header>
  <div id="map" class="show"></div>
  <div id="list" class="hide"></div>
</aside>
<main>
  <div class="toolbar">
    <span class="preset">
      <select id="preset" title="저장한 설정 불러오기"><option value="">저장한 설정 선택…</option></select>
      <button id="presetDel" title="선택한 설정 삭제">삭제</button>
    </span>
    <button id="presetSave">설정 저장</button>
    <button id="presetQR" title="지금 설정을 QR·링크로 다른 기기에 보내기">QR 만들기</button>
    <button id="itsKey" title="고속도로·국도 CCTV용 국가교통정보센터 인증키">인증키 입력</button>
    <label>열 <select id="cols"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <button class="primary" id="capAll">전체 캡처</button>
    <button id="clear">모두 비우기</button>
    <button id="export">설정 복사</button>
    <span id="status"></span>
  </div>
  <div id="grid"></div>
</main>
<div id="toast"></div>
<div id="backdrop"></div>
<button class="navbtn" id="navPrev" title="이전 CCTV (←)">‹</button>
<button class="navbtn" id="navNext" title="다음 CCTV (→)">›</button>
<div id="navCount"></div>
<div id="qrBox"><div class="box">
  <p id="qrTitle"></p>
  <div id="qrImg"></div>
  <p class="hint" style="margin:8px 0 0">휴대폰 카메라로 찍으면 이 설정이 그 기기에 추가돼요.</p>
  <label id="qrKeyWrap" style="display:block;font-size:12px;margin-top:8px;color:#ffb35c"><input type="checkbox" id="qrKey" checked> 인증키도 같이 보내기 (내 기기에만 쓰세요)</label>
  <input id="qrLink" type="text" readonly>
  <div class="btns"><button class="primary" id="qrCopy">링크 복사</button><button id="qrClose">닫기</button></div>
</div></div>
<div id="dlg"><div class="box">
  <p id="dlgTitle"></p>
  <input id="dlgInput" type="text" maxlength="30">
  <p id="dlgNote"></p>
  <div class="btns"><button class="primary" id="dlgOk">확인</button><button id="dlgCancel">취소</button></div>
</div></div>
<div id="exportBox"><div>
  <p style="margin:0 0 8px;font-size:14px">지금 화면 설정이에요. 복사해서 Claude에게 붙여 넣으면 같은 화면으로 아침 캡처를 예약할 수 있어요.</p>
  <textarea id="exportText" readonly></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;background:none;padding:0;width:auto">
    <button class="primary" id="exportCopy">복사</button><button id="exportClose">닫기</button>
  </div>
</div></div>

<script>
const API = 'https://its.busan.go.kr/api-n/v1/bsits/user/cctvs';
const KEY = 'busan-cctv-selected';
// 처음 여는 기기에서 보여줄 기본 구성 (모아보기 순서)
const DEFAULT_SELECTED = ['CTV0000137','CTV0000195','CTV0000069','CTV0000525','CTV0000522','CTV0000519','CTV0000702',
  'CTV0000706','CTV0000003','CTV0000051','CTV0000050','CTV0000052','CTV0000138','CTV0000034'];
const DEFAULT_COLS = '2';
const DEFAULT_VIEW = { c:[35.08325,129.04996], z:13 };
let all = [];                 // 전체 CCTV 목록
let selected = load();        // 선택된 cctvId 순서 배열
const players = new Map();    // cctvId -> {hls, video, el}

function load(){
  try { const v = localStorage.getItem(KEY); return v === null ? DEFAULT_SELECTED.slice() : (JSON.parse(v) || []); }
  catch(e){ return DEFAULT_SELECTED.slice(); }
}
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(selected));
    // 고속도로·국도 CCTV는 이름·위치를 같이 저장해 두었다가 다음에 바로 보여줌
    const meta = {}; selected.filter(isNat).forEach(id => { const c = nat.get(id); if (c) meta[id] = { instlPos:c.instlPos, instlAddr:c.instlAddr, lat:c.lat, lot:c.lot, src:c.src }; });
    localStorage.setItem(KEY+'-nat', JSON.stringify(meta));
  } catch(e){}
}
// ---------- 전국 고속도로·국도 CCTV (국가교통정보센터 오픈API) ----------
// 인증키는 코드에 넣지 않고, 각 기기 브라우저에만 저장 (공개 페이지라서)
let ITS_KEY = ''; try { ITS_KEY = localStorage.getItem(KEY+'-itskey') || ''; } catch(e){}
let natReload = () => {};
async function setItsKey(k){
  k = (k||'').trim(); if (!k) return false;
  // 키가 맞는지 작은 범위로 한 번 확인
  const u = `${ITS_API}?apiKey=${encodeURIComponent(k)}&type=ex&cctvType=1&minX=129&maxX=129.1&minY=35.2&maxY=35.3&getType=json`;
  let ok = false; try { const j = await fetch(u).then(r => r.json()); ok = !!(j && j.response && Array.isArray(j.response.data)); } catch(e){}
  if (!ok) return false;
  ITS_KEY = k; try { localStorage.setItem(KEY+'-itskey', k); } catch(e){}
  updateKeyBtn(); natReload();
  players.forEach(p => { if (p.c.src && !p.c.hlsAddr) p.start(); }); // 키 없어서 멈춰 있던 화면 다시 연결
  return true;
}
async function askItsKey(){
  const k = await dialog({ title:'국가교통정보센터 인증키를 넣어 주세요. 이 기기에만 저장돼요.', value:ITS_KEY, okText:'저장',
    check: v => v && !/^[0-9a-f]{32}$/i.test(v) ? '보통 영문·숫자 32자예요.' : '' });
  if (!k) return;
  toast('인증키 확인 중…');
  if (await setItsKey(k)) toast('인증키 저장됨 · 고속도로·국도 CCTV를 불러와요');
  else toast('인증키를 확인하지 못했어요. 다시 확인해 주세요.');
}
function updateKeyBtn(){ const b = $('#itsKey'); if (b) { b.textContent = ITS_KEY ? '인증키 ✓' : '인증키 입력'; b.classList.toggle('primary', !ITS_KEY); } }
const ITS_API = 'https://openapi.its.go.kr:9443/cctvInfo';
const nat = new Map();   // id -> CCTV
let natMeta = {}; try { natMeta = JSON.parse(localStorage.getItem(KEY+'-nat')) || {}; } catch(e){}
const isNat = id => /^[ei]\d+_\d+$/.test(id);
const natId = (t,x,y) => (t==='ex'?'e':'i') + Math.round(x*1e5) + '_' + Math.round(y*1e5);
function natItem(t, d){
  const x = +d.coordx, y = +d.coordy;
  return { cctvId:natId(t,x,y), instlPos:String(d.cctvname||'').trim(), instlAddr:t==='ex'?'고속도로':'국도',
           lat:y, lot:x, hlsAddr:String(d.cctvurl||'').replace(/^http:/,'https:'), src:t };
}
async function fetchNat(t, minX, maxX, minY, maxY){
  if (!ITS_KEY) throw new Error('no key');
  const u = `${ITS_API}?apiKey=${ITS_KEY}&type=${t}&cctvType=1&minX=${minX}&maxX=${maxX}&minY=${minY}&maxY=${maxY}&getType=json`;
  const j = await fetch(u).then(r => r.json());
  return ((j.response && j.response.data) || []).filter(d => d.cctvurl && d.coordx && d.coordy).map(d => natItem(t, d));
}
function ensureNat(id){ // 아직 지도에서 안 불러온 고속도로·국도 CCTV는 저장된 정보로 자리만 만들어 둠
  if (nat.has(id)) return nat.get(id);
  const m = id.match(/^([ei])(\d+)_(\d+)$/); if (!m) return undefined;
  const meta = natMeta[id] || {};
  const c = { cctvId:id, instlPos:meta.instlPos || '고속도로·국도 CCTV', instlAddr:meta.instlAddr || (m[1]==='e'?'고속도로':'국도'),
              lat:+m[3]/1e5, lot:+m[2]/1e5, hlsAddr:'', src:m[1]==='e'?'ex':'its' };
  nat.set(id, c); return c;
}
async function resolveNat(id){ // 영상 주소(토큰 포함)를 새로 받아 옴
  const c = ensureNat(id); if (!c) return null;
  const d = 0.0005, list = await fetchNat(c.src, c.lot-d, c.lot+d, c.lat-d, c.lat+d);
  let best = list.find(x => x.cctvId === id);
  if (!best && list.length) best = list.sort((a,b)=>Math.hypot(a.lot-c.lot,a.lat-c.lat)-Math.hypot(b.lot-c.lot,b.lat-c.lat))[0];
  if (best) { Object.assign(c, { instlPos:best.instlPos, hlsAddr:best.hlsAddr }); }
  return c;
}
const $ = s => document.querySelector(s);
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.opacity=0,2200); }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function stampText(){ return new Date().toLocaleString('ko-KR'); }
const byId = id => all.find(c => c.cctvId === id) || nat.get(id) || (isNat(id) ? ensureNat(id) : undefined);

async function init(){
  try {
    const res = await fetch(API);
    all = await res.json();

let map = null; const markers = new Map();
const SRC_COLOR = { busan:'#3d7bfd', ex:'#f08c00', its:'#2f9e44' };
function markerStyle(on, src){
  return on ? { radius:9, color:'#fff', weight:2, fillColor:'#ff4d4f', fillOpacity:1 }
            : { radius:src ? 5 : 6, color:'#fff', weight:1, fillColor:SRC_COLOR[src||'busan'], fillOpacity:.9 };
}
function initMap(){

  street2.addTo(map);
  // 부산시 교통정보센터 소통정보 레이어 (사이트와 같은 색: 초록 25km/h 이상, 주황 15~25, 빨강 15 미만)
  // 사이트와 같이 확대 단계별로 레이어 교체: 넓게 볼 땐 굵은 면, 중간엔 가는 면, 가까이 보면 선
  const trafficLayerFor = z => z <= 12 ? 'bsits:vw_link2_poly_trfc' : z <= 14 ? 'bsits:vw_link1_poly_trfc' : 'bsits:vw_link1_line_trfc';
  const traffic = L.tileLayer.wms('https://its.busan.go.kr/geoserver/bsits/wms', {

  }).addTo(map);
  map.on('zoomend', () => { const l = trafficLayerFor(map.getZoom()); if (traffic.wmsParams.layers !== l) traffic.setParams({ layers:l }); });
  setInterval(() => traffic.setParams({ trafficVersion:Date.now() }), 3*60000); // 3분마다 갱신
  const layersCtl = L.control.layers({ '일반 지도':street2, '일반 지도 (예비)':street, '위성':sat }, { '소통정보':traffic }, { position:'topright' }).addTo(map);
  const legend = L.control({ position:'bottomright' });
  legend.onAdd = () => { const d = L.DomUtil.create('div'); d.style.cssText='background:rgba(255,255,255,.9);color:#222;padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.6';
    d.innerHTML = '<b>CCTV</b><br><span style="color:#3d7bfd">●</span> 부산시 <span style="color:#f08c00">●</span> 고속도로 <span style="color:#2f9e44">●</span> 국도<br><b>소통정보</b> (부산)<br><span style="color:#1aa260">●</span> 25km/h 이상<br><span style="color:#f5a000">●</span> 15~25km/h<br><span style="color:#e03030">●</span> 15km/h 미만'; return d; };
  legend.addTo(map);
  const busanLayer = L.layerGroup().addTo(map), natLayer = L.layerGroup().addTo(map);
  all.forEach(c => { if (c.lat && c.lot) addMarker(c, busanLayer); });
  layersCtl.addOverlay(busanLayer, '<span style="color:#3d7bfd">●</span> 부산시 CCTV');
  layersCtl.addOverlay(natLayer, '<span style="color:#f08c00">●</span> 고속도로 · <span style="color:#2f9e44">●</span> 국도 CCTV');
  // 고속도로·국도 CCTV는 지금 보고 있는 지역만 불러옴 (전국은 1만 개가 넘어서)
  const loaded = new Set(), G = 0.5;

  map.on('move zoom', placePreview);

const hoverNone = window.matchMedia && matchMedia('(hover: none)').matches;

const preview = { id:null, hls:null, el:null, timer:null, touchOpen:false, m:null };

function placePreview(){
  if (!preview.el || !preview.m) return;
  const r = $('#map').getBoundingClientRect(), pt = map.latLngToContainerPoint(preview.m.getLatLng());
  const x = r.left + pt.x, y = r.top + pt.y, W = preview.el.offsetWidth, H = preview.el.offsetHeight, pad = 8;
  let left = x - W/2, top = y - H - 14;                     // 기본: 점 위쪽

  left = Math.max(pad, Math.min(innerWidth - W - pad, left)); // 화면 밖으로 안 나가게
  top = Math.max(pad, Math.min(innerHeight - H - pad, top));
  preview.el.style.left = left + 'px'; preview.el.style.top = top + 'px';
}
function openPreview(c, m){

function updatePreview(){

function closePreview(){

function addMarker(c, layer){

  m.on('mouseover', e => { if (!isTouch(e)) openPreview(c, m); });

// 목록에서 ≡ 를 잡고 끌어서 순서 바꾸기 (마우스·터치 공통)

let drag = null;

// 다른 항목이 부드럽게 밀려나도록 (FLIP 애니메이션)
function animateShift(mutate){
  const items = selItems().filter(x => x !== drag.it);
  const before = new Map(items.map(x => [x, x.offsetTop]));
  mutate();
  items.forEach(x => {
    const dy = before.get(x) - x.offsetTop; if (!dy) return;
    x.style.transition = 'none'; x.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { x.style.transition = 'transform .16s ease'; x.style.transform = ''; });
  });
}
listEl().addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h) return;
  e.preventDefault();
  const it = h.closest('[data-sel]'), r = it.getBoundingClientRect();
  const ghost = it.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width:r.width+'px', left:r.left+'px', top:r.top+'px' });
  document.body.appendChild(ghost);
  drag = { it, ghost, pid:e.pointerId, scroll:null, y:e.clientY, grab:e.clientY - r.top, h:r.height };
  h.setPointerCapture(e.pointerId);
  it.classList.add('placeholder');
});
function dragMove(y){
  if (!drag) return;
  drag.y = y;
  drag.ghost.style.top = (y - drag.grab) + 'px';
  // 잔상의 가운데가 어느 항목의 절반을 넘었는지로 놓일 자리 결정
  const L = listEl(), lr = L.getBoundingClientRect();
  const center = (y - drag.grab + drag.h/2) - lr.top + L.scrollTop;
  const others = selItems().filter(x => x !== drag.it);
  let target = null;
  for (const x of others) { if (center < x.offsetTop + x.offsetHeight/2) { target = x; break; } }
  const needMove = target ? drag.it.nextElementSibling !== target : (others.length && others[others.length-1].nextElementSibling !== drag.it);
  if (needMove) animateShift(() => target ? target.before(drag.it) : others[others.length-1].after(drag.it));
  // 목록 위·아래 끝에 가까우면 자동 스크롤
  const edge = 40, v = y < lr.top + edge ? -8 : y > lr.bottom - edge ? 8 : 0;
  clearInterval(drag.scroll); drag.scroll = v ? setInterval(() => { L.scrollTop += v; dragMove(drag.y); }, 30) : null;
}
listEl().addEventListener('pointermove', e => { if (drag && e.pointerId === drag.pid) dragMove(e.clientY); });
function dragEnd(e){
  if (!drag || (e && e.pointerId !== drag.pid)) return;

  // 잔상이 빈 칸으로 쏙 들어가는 마무리 애니메이션
  const r = d.it.getBoundingClientRect();
  d.ghost.style.transition = 'top .15s ease, opacity .15s ease, box-shadow .15s ease';
  d.ghost.style.top = r.top + 'px'; d.ghost.style.boxShadow = 'none';
  setTimeout(() => {
    d.ghost.remove(); d.it.classList.remove('placeholder');

    if (next.join() !== selected.join()) { selected = next; save(); renderGrid(); }
    renderList();
  }, 160);
}

  // 제거된 플레이어 정리
  for (const [id,p] of players) if (!selected.includes(id)) { p.hls && p.hls.destroy(); p.el.remove(); players.delete(id); }
  if (typeof refreshMarkers === 'function') refreshMarkers();
  if (!selected.length) { grid.innerHTML = '<div class="empty">왼쪽 목록에서 보고 싶은 CCTV를 체크하세요.<br>선택은 이 브라우저에 저장돼서 다음에 열어도 그대로예요.</div>'; $('#status').textContent=''; return; }
  grid.querySelector('.empty')?.remove();
  selected.forEach(id => {
    let p = players.get(id);
    if (!p) p = makeTile(byId(id));
    grid.appendChild(p.el); // 순서 맞추기
  });
  $('#status').textContent = `${selected.length}개 보는 중`;
}

function makeTile(c){
  const el = document.createElement('div'); el.className='tile'; el.draggable=true; el.dataset.id=c.cctvId;
  el.innerHTML = `<video muted playsinline autoplay></video><div class="msg">연결 중…</div>
    <div class="bar"><span title="${c.instlAddr||''}">${c.instlPos}</span>
    <button data-act="reload" title="다시 연결">↻</button><button data-act="del" title="빼기">✕</button></div>`;
  const video = el.querySelector('video'), msg = el.querySelector('.msg');
  const p = { el, video, hls:null, c };
  const start = async () => {
    p.hls && p.hls.destroy(); p.hls = null; msg.textContent='연결 중…'; msg.style.display='flex';
    // 고속도로·국도 CCTV: 영상 주소에 유효시간이 있어서 처음이거나 끊겼으면 새 주소를 받아 옴
    if (c.src && (!c.hlsAddr || p.failed)) {
      try { await resolveNat(c.cctvId); el.querySelector('.bar span').textContent = c.instlPos; save(); } catch(e){}
      if (players.get(c.cctvId) !== p) return;
    }
    if (c.src && !ITS_KEY) { msg.textContent='인증키를 넣으면 볼 수 있어요 (위쪽 "인증키 입력")'; return; }
    if (!c.hlsAddr) { msg.textContent='영상 주소를 받지 못했어요 · 30초 후 재시도'; p.failed = true;
      clearTimeout(p.retry); p.retry = setTimeout(() => { if (players.get(c.cctvId) === p) start(); }, 30000); return; }
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ liveSyncDurationCount:2, manifestLoadingMaxRetry:4, levelLoadingMaxRetry:4, fragLoadingMaxRetry:4 });
      hls.loadSource(c.hlsAddr); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { p.failed = false; });
      hls.on(Hls.Events.ERROR, (_,d) => { if (d.fatal) {
        const quick = c.src && !p.failed; p.failed = true;
        msg.textContent = quick ? '다시 연결 중…' : '영상 신호 없음 · 30초 후 자동 재연결'; msg.style.display='flex';
        clearTimeout(p.retry); p.retry = setTimeout(() => { if (players.get(c.cctvId) === p) start(); }, quick ? 1500 : 30000);
      } });
      p.hls = hls;
    } else { video.src = c.hlsAddr; } // Safari 기본 HLS
    video.play().catch(()=>{});
  };
  p.start = start;
  video.addEventListener('playing', () => msg.style.display='none');
  video.addEventListener('click', () => el.classList.contains('big') ? closeBig() : openBig(el));
  el.querySelector('.bar').addEventListener('click', e => {
    const act = e.target.dataset.act;
    if (act==='reload') start();
    if (act==='del') { closeBig(); selected = selected.filter(x=>x!==c.cctvId); save(); renderGrid(); renderList(); }
  });
  // 드래그로 순서 바꾸기
  el.addEventListener('dragstart', () => el.classList.add('dragging'));
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); selected=[...document.querySelectorAll('#grid .tile')].map(t=>t.dataset.id); save(); renderList(); });
  el.addEventListener('dragover', e => { e.preventDefault(); const d=document.querySelector('.tile.dragging'); if(!d||d===el) return;
    const r=el.getBoundingClientRect(); const after = (e.clientX - r.left) > r.width/2;
    el.parentNode.insertBefore(d, after ? el.nextSibling : el); });
  start();
  players.set(c.cctvId, p);
  return p;
}

// ---------- 크게 보기 ----------
const navEls = ['#backdrop','#navPrev','#navNext','#navCount'];
function openBig(el){
  closeBig(); el.classList.add('big'); el.draggable=false;
  navEls.forEach(s=>$(s).classList.add('show'));
  const tiles = [...document.querySelectorAll('#grid .tile')], i = tiles.indexOf(el);
  $('#navCount').textContent = `${i+1} / ${tiles.length}`;
  const multi = tiles.length > 1;
  $('#navPrev').style.visibility = $('#navNext').style.visibility = multi ? 'visible' : 'hidden';
}
function closeBig(){
  document.querySelectorAll('.tile.big').forEach(t=>{
    if (t.classList.contains('temp')) { t._hls && t._hls.destroy(); t.remove(); return; } // 지도 미리보기에서 연 임시 화면
    t.classList.remove('big'); t.draggable=true;
  });
  navEls.forEach(s=>$(s).classList.remove('show'));
}
// 지도 미리보기에서 영상을 눌렀을 때: 모아보기에 없어도 크게 보기 (추가 버튼 포함)
function openPreviewBig(c){
  const inGrid = players.get(c.cctvId);
  if (inGrid) { openBig(inGrid.el); return; }
  closeBig();
  const el = document.createElement('div'); el.className = 'tile big temp';
  el.innerHTML = `<video muted playsinline autoplay></video><div class="msg">연결 중…</div>
    <div class="bar"><span>${c.instlPos}</span><button class="primary" data-act="add">+ 모아보기에 추가</button><button data-act="close" title="닫기">✕</button></div>`;
  document.body.appendChild(el);
  const v = el.querySelector('video'), msg = el.querySelector('.msg');
  v.addEventListener('playing', () => msg.style.display='none');
  v.addEventListener('click', closeBig);
  if (window.Hls && Hls.isSupported()) { const hl = new Hls({ liveSyncDurationCount:2 }); hl.loadSource(c.hlsAddr); hl.attachMedia(v); el._hls = hl;
    hl.on(Hls.Events.ERROR, (_,d) => { if (d.fatal) msg.textContent='영상 신호 없음'; }); }
  else v.src = c.hlsAddr;
  v.play().catch(()=>{});
  el.querySelector('.bar').addEventListener('click', e => {
    const a = e.target.dataset.act;
    if (a === 'close') closeBig();
    if (a === 'add') { closeBig(); if (!selected.includes(c.cctvId)) toggle(c.cctvId); const p = players.get(c.cctvId); if (p) openBig(p.el); }
  });
  $('#backdrop').classList.add('show');
}
function stepBig(d){
  const cur = document.querySelector('.tile.big'); if (!cur || cur.classList.contains('temp')) return;
  const tiles = [...document.querySelectorAll('#grid .tile')]; if (tiles.length < 2) return;
  const next = tiles[(tiles.indexOf(cur) + d + tiles.length) % tiles.length]; // 끝에서 처음으로 순환
  openBig(next);
}
$('#navPrev').addEventListener('click', () => stepBig(-1));
$('#navNext').addEventListener('click', () => stepBig(1));
$('#backdrop').addEventListener('click', closeBig);
document.addEventListener('keydown', e => {
  if (!document.querySelector('.tile.big')) return;
  if (e.key==='Escape') closeBig();
  if (e.key==='ArrowLeft') stepBig(-1);
  if (e.key==='ArrowRight') stepBig(1);
});
// 휴대폰: 크게 본 화면에서 좌우로 밀어서 넘기기
let touchX = null;
document.addEventListener('touchstart', e => { if (document.querySelector('.tile.big')) touchX = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 60) stepBig(dx < 0 ? 1 : -1);
}, { passive:true });

// 영상 한 프레임 + 이름/시각을 캔버스에 그리기
const SCALE = 2; // 원본이 320x240이라 2배로 키워 저장
function drawFrame(ctx, p, x, y, w, h){
  ctx.fillStyle='#000'; ctx.fillRect(x,y,w,h);
  const v=p.video;
  if (v.videoWidth) ctx.drawImage(v, x, y, w, h);
  else { ctx.fillStyle='#888'; ctx.font=`${14*SCALE/2+6}px sans-serif`; ctx.fillText('영상 없음', x+12, y+h/2); }
  const label = `${p.c.instlPos}  ·  ${stampText()}`;
  ctx.font = `bold ${Math.round(w/32)}px sans-serif`;
  const pad = Math.round(w/80), th = Math.round(w/32)+pad*2;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x, y+h-th, w, th);
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(label, x+pad, y+h-th/2);
}
function download(canvas, name){
  canvas.toBlob(b => { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }, 'image/png');
}
function safe(s){ return s.replace(/[\\/:*?"<>|\s]+/g,'_'); }
function captureAll(){
  const list = selected.map(id=>players.get(id)).filter(Boolean);
  if (!list.length) { toast('선택된 CCTV가 없어요.'); return; }
  const cols = Math.min(+$('#cols').value, list.length), rows = Math.ceil(list.length/cols);
  const w=320*SCALE, h=180*SCALE, gap=8; // 16:9
  const cv=document.createElement('canvas'); cv.width=cols*w+(cols-1)*gap; cv.height=rows*h+(rows-1)*gap;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#111'; ctx.fillRect(0,0,cv.width,cv.height);
  try {
    list.forEach((p,i)=> drawFrame(ctx, p, (i%cols)*(w+gap), Math.floor(i/cols)*(h+gap), w, h));
    download(cv, `CCTV_모아보기_${stamp()}.png`); toast('캡처 저장됨');
  } catch(e){ toast('이 브라우저에서는 캡처가 막혀 있어요. 크롬이나 엣지로 열어 주세요.'); }
}
$('#capAll').addEventListener('click', captureAll);
// 모두 비우기: 화면의 CCTV를 전부 빼기 (저장한 설정은 그대로)
$('#clear').addEventListener('click', async () => {
  if (!selected.length) { toast('비울 CCTV가 없어요.'); return; }
  const ok = await dialog({ title:`화면의 CCTV ${selected.length}개를 모두 뺄까요? 저장한 설정은 그대로 남아요.`, okText:'모두 비우기' });
  if (!ok) return;
  closeBig(); selected = []; save(); renderGrid(); renderList(); toast('모두 비웠어요');
});

// ---------- 이름 붙여 설정 저장 / 불러오기 / 삭제 ----------
const PKEY = KEY + '-presets';
function loadPresets(){
  try { const v = localStorage.getItem(PKEY); if (v !== null) return JSON.parse(v) || {}; } catch(e){}
  return { '기본': { selected:DEFAULT_SELECTED.slice(), cols:DEFAULT_COLS, view:DEFAULT_VIEW } }; // 처음엔 기본 구성 하나를 넣어 둠
}
let presets = loadPresets();
function savePresets(){ try { localStorage.setItem(PKEY, JSON.stringify(presets)); localStorage.setItem(KEY+'-preset-cur', $('#preset').value); } catch(e){ toast('이 브라우저에서는 저장이 안 돼요.'); } }
function renderPresets(cur){
  const names = Object.keys(presets).sort((a,b)=>a.localeCompare(b,'ko'));
  $('#preset').innerHTML = '<option value="">저장한 설정 선택…</option>' +
    names.map(n => `<option value="${n.replace(/"/g,'&quot;')}">${n.replace(/</g,'&lt;')}</option>`).join('');
  $('#preset').value = cur && presets[cur] ? cur : '';
  $('#presetDel').disabled = !$('#preset').value;
}
function currentSettings(){
  const s = { selected:selected.slice(), cols:$('#cols').value, wide:!!document.querySelector('aside').style.width };
  if (map) { const c = map.getCenter(); s.view = { c:[+c.lat.toFixed(5), +c.lng.toFixed(5)], z:map.getZoom() }; }
  return s;
}
function applySettings(s){
  closeBig();
  selected = (s.selected||[]).filter(id => !all.length || isNat(id) || byId(id));
  save();
  $('#cols').value = s.cols || DEFAULT_COLS; setCols();
  setWide(!!s.wide);
  if (map && s.view) map.setView(s.view.c, s.view.z);
  renderGrid(); renderList();
}
// 간단한 입력/확인 창 (브라우저 기본 팝업 대신)
function dialog({ title, value=null, okText='확인', check=null }){
  return new Promise(res => {
    $('#dlgTitle').textContent = title; $('#dlgOk').textContent = okText; $('#dlgNote').textContent = '';
    const inp = $('#dlgInput'); inp.style.display = value === null ? 'none' : ''; inp.value = value || '';
    $('#dlg').classList.add('show'); if (value !== null) setTimeout(() => { inp.focus(); inp.select(); }, 30);
    const upd = () => { if (check) $('#dlgNote').textContent = check(inp.value.trim()) || ''; };
    inp.oninput = upd; upd();
    const done = v => { $('#dlg').classList.remove('show'); inp.oninput = null; $('#dlgOk').onclick = $('#dlgCancel').onclick = inp.onkeydown = null; res(v); };
    $('#dlgOk').onclick = () => { const v = inp.value.trim(); if (value !== null && !v) { inp.focus(); return; } done(value === null ? true : v); };
    $('#dlgCancel').onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') $('#dlgOk').click(); if (e.key === 'Escape') done(null); };
  });
}
$('#presetSave').addEventListener('click', async () => {
  const name = await dialog({ title:'지금 화면을 어떤 이름으로 저장할까요?', value:$('#preset').value || '', okText:'저장',
    check: v => presets[v] ? `"${v}" 설정을 지금 화면으로 덮어써요.` : '' });
  if (!name) return;
  presets[name] = currentSettings(); renderPresets(name); savePresets();
  toast(`"${name}" 저장됨`);
});
$('#preset').addEventListener('change', () => {
  const n = $('#preset').value; $('#presetDel').disabled = !n;
  try { localStorage.setItem(KEY+'-preset-cur', n); } catch(e){}
  if (n && presets[n]) { applySettings(presets[n]); toast(`"${n}" 불러옴`); }
});
$('#presetDel').addEventListener('click', async () => {
  const n = $('#preset').value; if (!n) return;
  const ok = await dialog({ title:`"${n}" 설정을 삭제할까요? 되돌릴 수 없어요.`, okText:'삭제' });
  if (!ok) return;
  delete presets[n]; renderPresets(''); savePresets(); toast(`"${n}" 삭제됨`);
});
try { renderPresets(localStorage.getItem(KEY+'-preset-cur') || ''); } catch(e){ renderPresets(''); }

// ---------- QR·링크로 설정 보내기 / 받기 ----------
// 링크 형식: ...?s=<압축 설정>  (이름|열|위도,경도,줌|CCTV번호.번호.번호…)
function encodeSettings(name, s, key){
  const ids = (s.selected||[]).map(id => isNat(id) ? id : String(+id.replace(/\D/g,''))).join('.');
  const v = s.view ? `${s.view.c[0]},${s.view.c[1]},${s.view.z}` : '';
  return [name, s.cols||'', v, ids, s.wide?'1':'', key||''].map(encodeURIComponent).join('|');
}
function decodeSettings(str){
  const [name, cols, v, ids, wide, key] = str.split('|').map(decodeURIComponent);
  const s = { selected:(ids||'').split('.').filter(Boolean).map(n => isNat(n) ? n : 'CTV' + n.padStart(7,'0')), cols:cols||DEFAULT_COLS, wide:wide==='1' };
  if (v) { const [a,b,z] = v.split(',').map(Number); if (!isNaN(a)&&!isNaN(b)&&!isNaN(z)) s.view = { c:[a,b], z }; }
  return { name: name || '받은 설정', s, key: key || '' };
}
function makeQR(){
  const name = $('#preset').value || '공유 설정';
  const s = currentSettings(); // 지금 화면 그대로 보냄
  $('#qrKeyWrap').style.display = ITS_KEY ? 'block' : 'none';
  const url = location.origin + location.pathname + '?s=' + encodeSettings(name, s, ITS_KEY && $('#qrKey').checked ? ITS_KEY : '');
  $('#qrTitle').textContent = `"${name}" 설정 (${s.selected.length}개 CCTV)`;
  $('#qrLink').value = url;
  if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(url); q.make(); $('#qrImg').innerHTML = q.createSvgTag({ cellSize:4, margin:2, scalable:true }); }
  else $('#qrImg').textContent = 'QR을 만들지 못했어요. 링크를 복사해서 보내 주세요.';
  $('#qrBox').classList.add('show');
}
$('#presetQR').addEventListener('click', makeQR);
$('#qrKey').addEventListener('change', makeQR);
$('#itsKey').addEventListener('click', askItsKey);
updateKeyBtn();
$('#qrCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#qrLink').value); } catch(e){ $('#qrLink').select(); document.execCommand('copy'); }
  toast('링크를 복사했어요');
});
$('#qrClose').addEventListener('click', () => $('#qrBox').classList.remove('show'));
$('#qrBox').addEventListener('click', e => { if (e.target.id === 'qrBox') $('#qrBox').classList.remove('show'); });
// 링크로 열었을 때: 설정 추가할지 묻고, 주소창은 깔끔하게 정리
async function importFromUrl(){
  const raw = new URLSearchParams(location.search).get('s'); if (!raw) return;
  history.replaceState(null, '', location.pathname);
  let got; try { got = decodeSettings(raw); } catch(e){ toast('설정 링크를 읽지 못했어요.'); return; }
  const name = await dialog({ title:`받은 설정(${got.s.selected.length}개 CCTV)을 이 기기에 추가할까요? 이름을 정해 주세요.`, value:got.name, okText:'추가',
    check: v => presets[v] ? `이 기기에 있는 "${v}" 설정을 덮어써요.` : '' });
  if (!name) return;
  if (got.key && got.key !== ITS_KEY) await setItsKey(got.key); // 같이 온 인증키 저장
  presets[name] = got.s; renderPresets(name); savePresets();
  applySettings(got.s); toast(`"${name}" 추가됨`);
}

init();
</script>
