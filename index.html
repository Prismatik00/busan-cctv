<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 CCTV 모아보기</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#272b35; --text:#e7e9ee; --muted:#8b91a0; --accent:#3d7bfd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tabs button { flex:1; padding:7px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #map { flex:1; min-height:300px; display:none; }
  #map.show { display:block; }
  #list.hide { display:none; }
  .leaflet-tooltip { font-size:12px; }
  .nat-toggle { background:#fff; color:#333; border:2px solid rgba(0,0,0,.2); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; cursor:pointer; }
  .nat-toggle.on { background:#263049; color:#fff; border-color:#3d7bfd; }
  .nat-hint { background:rgba(23,26,33,.85); color:#fff; font-size:11px; padding:5px 8px; border-radius:6px; }
  .pv { position:fixed; z-index:1300; width:260px; background:#171a21; color:#e7e9ee; border:1px solid #2c3240; border-radius:10px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.5); cursor:pointer; }
  .pv-x { float:right; color:#aaa; padding:0 4px; cursor:pointer; }
  .pv-name { font-size:13px; font-weight:600; margin:0 2px 6px 2px; }
  .pv-vid { position:relative; background:#000; border-radius:6px; overflow:hidden; cursor:zoom-in; }
  .pv-vid::after { content:'⤢ 크게 보기'; position:absolute; right:6px; bottom:6px; font-size:11px; background:rgba(0,0,0,.6); color:#fff; padding:2px 6px; border-radius:6px; }
  .pv { cursor:default; }
  .pv-vid video { width:100%; aspect-ratio:16/9; object-fit:fill; display:block; }
  .pv-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8b91a0; font-size:12px; }
  .pv-btn { width:100%; margin-top:6px; background:#3d7bfd; border-color:#3d7bfd; color:#fff; font-size:12px; padding:6px; }
  .pv-btn.on { background:#2a2f3a; border-color:#3a4050; color:#ffb0b0; }
  .preset { display:inline-flex; gap:0; }
  .preset select { border-radius:8px 0 0 8px; max-width:180px; }
  .preset button { border-radius:0 8px 8px 0; border-left:none; color:#ff8a8a; }
  .preset button:disabled { color:var(--muted); opacity:.5; cursor:default; }
  #qrBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2600; }
  #qrBox.show { display:flex; }
  #qrBox .box { background:var(--panel); padding:18px; border-radius:12px; width:min(360px,92vw); text-align:center; }
  #qrBox p { margin:0 0 10px; font-size:14px; }
  #qrImg { background:#fff; border-radius:8px; padding:10px; display:inline-block; }
  #qrImg img, #qrImg svg { display:block; width:260px; height:260px; max-width:70vw; max-height:70vw; }
  #qrLink { width:100%; margin-top:10px; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--muted); font-size:11px; }
  #qrBox .btns { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  #pedit { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2550; }
  #pedit.show { display:flex; }
  #pedit .box { background:var(--panel); padding:16px; border-radius:12px; width:min(380px,92vw); max-height:80vh; display:flex; flex-direction:column; }
  #peList { overflow:auto; margin:2px 0; }
  .pe-row { display:flex; align-items:center; gap:6px; padding:7px 8px; margin:3px 0; border-radius:7px; background:#1d212b; font-size:13px; }
  .pe-row .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pe-row .h { cursor:grab; color:var(--muted); font-size:18px; padding:0 4px; touch-action:none; user-select:none; }
  .pe-row button { padding:2px 8px; font-size:12px; }
  .pe-row.del { opacity:.45; } .pe-row.del .nm { text-decoration:line-through; }
  .pe-row.drag { background:#2a3a63; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #pedit .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  #dlg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2600; }
  #dlg.show { display:flex; }
  #dlg .box { background:var(--panel); padding:18px; border-radius:12px; width:min(380px,90vw); }
  #dlg p { margin:0 0 10px; font-size:14px; }
  #dlg #dlgNote { font-size:12px; color:#ffb35c; min-height:16px; margin:8px 0 0; }
  #dlg input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:15px; }
  #dlg .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  #exportBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:2000; }
  #exportBox.show { display:flex; }
  #exportBox div { background:var(--panel); padding:16px; border-radius:10px; width:min(520px,92vw); }
  #exportBox textarea { width:100%; height:180px; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
  aside { width:380px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside header { padding:14px 14px 8px; }
  h1 { font-size:16px; margin:0 0 10px; }
  input[type=search] { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:14px; }
  .hint { font-size:12px; color:var(--muted); margin:8px 0 0; }
  #list { overflow:auto; flex:1; padding:4px 6px 10px; }
  .item { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px; }
  .item:hover { background:#1f2330; }
  .item input { margin-top:2px; }
  .item .name { flex:1; min-width:0; }
  .item.sel { background:#1a2236; margin-bottom:3px; cursor:grab; }
  .item .num { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .item.sel { cursor:default; }
  .item .handle { flex:none; align-self:center; font-size:20px; line-height:1; padding:6px 10px; margin:-6px -4px -6px 0; color:var(--muted);
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; border-radius:6px; }
  .item .handle:hover { color:var(--text); background:#263049; }
  #list { position:relative; }
  .item.placeholder { background:transparent; outline:2px dashed #3d7bfd; outline-offset:-2px; }
  .item.placeholder > * { visibility:hidden; }
  .item.ghost { position:fixed; z-index:2500; margin:0; pointer-events:none; opacity:.85; background:#2a3a63;
    box-shadow:0 10px 28px rgba(0,0,0,.55); transform:scale(1.02); cursor:grabbing; }
  .item.ghost .handle { color:#fff; }
  body.dragging-list, body.dragging-list * { cursor:grabbing !important; user-select:none; }
  #loc { display:none; position:fixed; top:0; bottom:0; z-index:1200; background:var(--panel); border-right:1px solid var(--line);
    box-shadow:8px 0 24px rgba(0,0,0,.45); flex-direction:column; width:min(480px, calc(100vw - 390px)); transition:left .15s ease, width .15s ease; }
  #loc.show { display:flex; }
  .loc-head { display:flex; align-items:baseline; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .loc-head b { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .loc-head small { color:var(--muted); font-size:11px; white-space:nowrap; }
  .loc-head button { margin-left:auto; flex:none; padding:4px 9px; }
  .loc-vid { position:relative; background:#000; }
  .loc-vid video { width:100%; aspect-ratio:16/9; object-fit:fill; display:block; cursor:zoom-in; }
  #locMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; pointer-events:none; }
  .loc-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .loc-bar .hint { margin:0; font-size:11px; }
  #locAdd.on { background:#2a2f3a; border-color:#3a4050; color:#ffb0b0; }
  #locMap { flex:1; min-height:200px; }
  @media (max-width:760px){ #loc { left:0 !important; width:100%; } }
  #routeBox { padding:10px 12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:#151821; flex:none; max-height:55vh; overflow:auto; }
  #routeBox.hide { display:none; }
  .rb-head { display:flex; align-items:center; margin-bottom:4px; } .rb-head b { font-size:13px; } .rb-head button { margin-left:auto; padding:3px 8px; }
  .rb-naver { display:flex; gap:6px; margin:0 0 8px; }
  .rb-naver input { flex:1; min-width:0; padding:6px 8px; border-radius:7px; border:1px solid #03c75a; background:#0f1115; color:var(--text); font-size:12px; }
  .rb-pt { position:relative; display:flex; align-items:center; gap:6px; margin:4px 0; }
  .rb-pt .tag { flex:none; width:22px; height:22px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .rb-pt input { flex:1; min-width:0; padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:13px; }
  .rb-pt input.set { border-color:#3d7bfd; }
  .rb-pt .x { flex:none; padding:3px 7px; font-size:11px; }
  .rb-sug { position:absolute; left:28px; right:30px; top:100%; z-index:50; background:#1d212b; border:1px solid var(--line); border-radius:8px; max-height:240px; overflow:auto; box-shadow:0 8px 20px rgba(0,0,0,.5); }
  .rb-sug div { padding:7px 9px; font-size:12px; cursor:pointer; border-bottom:1px solid #242a36; }
  .rb-sug div:hover, .rb-sug div.on { background:#263049; }
  .rb-sug small { display:block; color:var(--muted); font-size:10px; margin-top:1px; }
  .rb-sug .k { color:#ffb35c; font-size:10px; margin-right:4px; }
  button.small { padding:3px 9px; font-size:12px; }
  .rb-opts { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0 4px; font-size:12px; color:var(--muted); }
  .rb-opts select { padding:3px 6px; font-size:12px; }
  #rbInfo { font-size:12px; margin:6px 0; min-height:16px; }
  .rb-btns { display:flex; gap:6px; }
  .inc-ico { width:22px; height:22px; border-radius:50%; color:#fff; font:700 12px/22px sans-serif; text-align:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.5); cursor:pointer; }
  .inc-toggle { background:#fff; color:#333; border:2px solid rgba(0,0,0,.2); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; cursor:pointer; }
  .inc-toggle.on { background:#4a1d1d; color:#fff; border-color:#e03131; }
  .inc-toggle .rf { margin-left:6px; opacity:.8; }
  .inc-card { position:fixed; z-index:1350; width:280px; background:#171a21; color:#e7e9ee; border:1px solid #2c3240; border-radius:10px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,.5); font-size:12px; }
  .inc-card .t { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .inc-card .badge { color:#fff; border-radius:6px; padding:1px 7px; font-weight:700; font-size:11px; }
  .inc-card .pl { font-weight:600; font-size:13px; flex:1; min-width:0; }
  .inc-card .x { background:none; border:none; color:#aaa; padding:0 4px; cursor:pointer; }
  .inc-card .msg { line-height:1.5; margin:4px 0 6px; color:#d0d4dc; }
  .inc-card .meta { color:var(--muted); font-size:11px; }
  .inc-card .bt { display:flex; gap:6px; margin-top:8px; }
  .inc-card .bt button { flex:1; padding:6px; font-size:12px; }
  .route-num { background:#ffd43b; color:#222; border:none; box-shadow:none; font:700 10px/1 sans-serif; padding:2px 4px; border-radius:8px; }
  .route-num::before { display:none; }
  .route-pin { width:24px; height:24px; border-radius:50%; color:#fff; font:700 11px/24px sans-serif; text-align:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .route-toggle { background:#fff; color:#333; border:2px solid rgba(0,0,0,.2); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; cursor:pointer; }
  .route-toggle.on { background:#5f3dc4; color:#fff; border-color:#7048e8; }
  #subtabs { display:flex; gap:4px; padding:0 14px 6px; }
  #subtabs.hide { display:none; }
  #subtabs button { flex:1; padding:6px; font-size:12px; }
  #subtabs button.on { background:#263049; border-color:#3d7bfd; color:#fff; }
  .road { display:flex; align-items:center; gap:8px; padding:9px 10px; margin:2px 0; border-radius:6px; background:#1d212b; cursor:pointer; font-size:13px; }
  .road:hover { background:#232838; }
  .road .cnt { margin-left:auto; color:var(--muted); font-size:11px; }
  .road .sc { background:#ff4d4f; color:#fff; border-radius:10px; font-size:10px; padding:1px 6px; }
  .road .arr { color:var(--muted); width:12px; }
  .road-items { padding-left:10px; border-left:2px solid #263049; margin:2px 0 8px 14px; }
  .item .seq { flex:none; color:var(--muted); font-size:11px; width:22px; text-align:right; margin-top:2px; }
  /* N(네이버 지도) 버튼: 다른 버튼과 같은 모양·색 */
  a.nv { flex:none; display:inline-flex; align-items:center; justify-content:center; background:#0f1115; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12px; line-height:1.15; text-decoration:none; cursor:pointer; }
  a.nv:hover { filter:brightness(1.15); }
  .item a.nv { padding:2px 7px; font-size:11px; align-self:center; }
  .loc-head a.nv { margin-left:auto; }
  .loc-head a.nv + button { margin-left:0; }
  .pv-row { display:flex; gap:6px; align-items:stretch; margin-top:6px; }
  .pv-row .pv-btn { margin-top:0; flex:1; }
  .item .go { flex:none; background:none; border:none; padding:0 4px; font-size:13px; cursor:pointer; opacity:.7; }
  .item .go:hover { opacity:1; }
  .sect { font-size:11px; color:var(--muted); margin:10px 8px 6px; }
  .item small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .toolbar label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  select, button { background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover { filter:brightness(1.15); }
  .stat { margin-left:auto; display:inline-flex; align-items:center; gap:6px; }
  #status { font-size:12px; color:var(--muted); }
  #reverse { background:none; border:none; padding:0 2px; font-size:15px; line-height:1; color:var(--muted); cursor:pointer; }
  #reverse:hover { color:var(--text); }
  /* 카드는 원래 비율(4:3) 크기를 유지하고, 넘치면 모아보기 영역이 스크롤됨 */
  #grid { flex:1; min-height:0; overflow-y:auto; padding:12px; display:grid; gap:10px; align-content:start; grid-auto-rows:max-content; }
  /* 카드: 영상 영역은 남는 공간에 맞춰 줄어들며 가장자리를 잘라 채우고(cover), 아래 이름·버튼 줄은 항상 그대로 */
  .tile { background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; min-height:0; }
  /* 부산 CCTV는 대부분 16:9 화면을 4:3·3:2(320x240, 720x480 등)로 눌러 보내므로 16:9로 펼쳐서 보여줌 */
  .tile video { width:100%; aspect-ratio:16/9; flex:none; height:auto; display:block; background:#000; object-fit:fill; }
  .tile .bar { flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--panel); font-size:13px; }
  .tile .bar span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .bar button { flex:none; padding:4px 8px; font-size:12px; }
  .tile .bar span { min-width:0; }
  .tile .bar span.nm { cursor:pointer; }
  .tile .bar button.dir { flex:none; width:24px; height:24px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; }
  .tile .bar button.dir span { flex:none; min-width:0; }
  .tile .bar button.dir .dot { width:5px; height:5px; border-radius:50%; background:var(--muted); }
  .tile .bar button.dir .arr { display:inline-block; font-size:14px; font-weight:700; line-height:1; transition:transform .2s ease; }
  .tile .bar button.dir.set { border-color:#3d7bfd; color:#9ec1ff; }
  .tile .bar span.nm:hover { text-decoration:underline; color:#9ec1ff; }
  .focus-ring { animation:focusPulse 1.2s ease-out 3; }
  @keyframes focusPulse { 0% { stroke-opacity:1; stroke-width:4; } 100% { stroke-opacity:0; stroke-width:14; } }
  .tile .msg { position:absolute; inset:0 0 34px 0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; pointer-events:none; }
  .empty { color:var(--muted); font-size:14px; padding:40px; text-align:center; grid-column:1/-1; }
  .tile.dragging { opacity:.4; }
  .tile video { cursor:zoom-in; }
  .tile.big { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1500; display:flex; flex-direction:column;
    width:min(92vw, calc((92vh - 44px) * 16 / 9)); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .tile.big video { cursor:zoom-out; }
  .tile.big .bar { font-size:15px; }
  #backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:1400; }
  #backdrop.show { display:block; }
  .navbtn { display:none; position:fixed; top:50%; transform:translateY(-50%); z-index:1600; width:52px; height:80px; border:none; border-radius:10px;
    background:rgba(20,22,30,.7); color:#fff; font-size:34px; line-height:80px; padding:0; cursor:pointer; }
  .navbtn:hover { background:rgba(61,123,253,.85); }
  .navbtn.show { display:block; }
  #navPrev { left:max(4px, calc(4vw - 56px)); }
  #navNext { right:max(4px, calc(4vw - 56px)); }
  #navCount { display:none; position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:1600; color:#fff; font-size:13px; background:rgba(20,22,30,.7); padding:3px 10px; border-radius:10px; }
  #navCount.show { display:block; }
  #toast { z-index:3000; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#222838; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  @media (max-width:760px){
    body{flex-direction:column;height:auto;overflow:auto}
    aside{width:100% !important;max-height:none}
    #map{flex:none;height:45vh;min-height:240px}
    #list{flex:none;max-height:45vh}
    #wide{display:none}
    main{min-height:60vh}
    #grid{overflow:visible}
    .navbtn{width:40px;height:64px;line-height:64px;font-size:28px}
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>부산 CCTV 모아보기</h1>
    <input id="q" type="search" placeholder="장소·주소 검색 (예: 서면, 해운대, 남천동)">
    <p class="hint" id="count">CCTV 목록 불러오는 중…</p>
    <div class="tabs"><button id="tabMap" class="on">지도</button><button id="tabList">목록</button><button id="wide" title="왼쪽 영역 넓히기/줄이기">지도 크게</button></div>
  </header>

<script>
const API = 'https://its.busan.go.kr/api-n/v1/bsits/user/cctvs';
const KEY = 'busan-cctv-selected';
// 처음 여는 기기에서 보여줄 기본 구성 (모아보기 순서)
const DEFAULT_SELECTED = ['CTV0000137','CTV0000195','CTV0000069','CTV0000525','CTV0000522','CTV0000519','CTV0000702',
  'CTV0000706','CTV0000003','CTV0000051','CTV0000050','CTV0000052','CTV0000138','CTV0000034'];
const DEFAULT_COLS = '2';
const DEFAULT_VIEW = { c:[35.08325,129.04996], z:13 };
let all = [];                 // 전체 CCTV 목록
let selected = load();        // 선택된 cctvId 순서 배열
const players = new Map();    // cctvId -> {hls, video, el}

function load(){
  try { const v = localStorage.getItem(KEY); return v === null ? DEFAULT_SELECTED.slice() : (JSON.parse(v) || []); }
  catch(e){ return DEFAULT_SELECTED.slice(); }
}
// CCTV별 방향 표시: 없음(점) → ↑ ↗ → ↘ ↓ ↙ ← ↖ → 다시 점. 지금 화면 것만 기억, 설정 저장 시 묶음마다 따로 저장
let dirs = {}; try { dirs = JSON.parse(localStorage.getItem(KEY+'-dirs')) || {}; } catch(e){}
const DIR_ARROW = ['↑','↗','→','↘','↓','↙','←','↖'];
function dirHtml(id){ const d = dirs[id]; return d === undefined
  ? `<button class="dir" data-act="dir" title="방향 표시 (누를 때마다 시계방향으로 돌아가요)"><span class="dot"></span></button>`
  : `<button class="dir set" data-act="dir" title="방향 표시 (누를 때마다 시계방향으로 돌아가요)"><span class="arr" style="transform:rotate(${d*45}deg)">↑</span></button>`; }
function cycleDir(id, btn){
  const d = dirs[id];
  if (d === undefined) dirs[id] = 0; else if (d >= 7) delete dirs[id]; else dirs[id] = d + 1;
  save();
  const arr = btn.querySelector('.arr');
  if (dirs[id] !== undefined && arr) { // 화살표는 부드럽게 시계방향으로 회전
    arr.style.transform = `rotate(${dirs[id]*45}deg)`;
  } else btn.outerHTML = dirHtml(id);
}
function paintDirs(){ players.forEach((p,id) => { const b = p.el.querySelector('.dir'); if (b) b.outerHTML = dirHtml(id); }); }
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(selected));
    Object.keys(dirs).forEach(id => { if (!selected.includes(id)) delete dirs[id]; }); // 뺀 CCTV의 방향은 지움
    localStorage.setItem(KEY+'-dirs', JSON.stringify(dirs));
    // 고속도로·국도 CCTV는 이름·위치를 같이 저장해 두었다가 다음에 바로 보여줌
    const meta = {}; selected.filter(isNat).forEach(id => { const c = nat.get(id); if (c) meta[id] = { instlPos:c.instlPos, instlAddr:c.instlAddr, lat:c.lat, lot:c.lot, src:c.src }; });
    localStorage.setItem(KEY+'-nat', JSON.stringify(meta));
  } catch(e){}
}
// ---------- 전국 고속도로·국도 CCTV (국가교통정보센터 오픈API) ----------
// 인증키는 코드에 넣지 않고, 각 기기 브라우저에만 저장 (공개 페이지라서)
let ITS_KEY = ''; try { ITS_KEY = localStorage.getItem(KEY+'-itskey') || ''; } catch(e){}
let natReload = () => {};
let natOn = false; try { natOn = localStorage.getItem(KEY+'-natOn') === '1'; } catch(e){}
let setNatOn = () => {};
async function setItsKey(k){
  k = (k||'').trim(); if (!k) return false;
  // 키가 맞는지 작은 범위로 한 번 확인
  const u = `${ITS_API}?apiKey=${encodeURIComponent(k)}&type=ex&cctvType=1&minX=129&maxX=129.1&minY=35.2&maxY=35.3&getType=json`;
  let ok = false; try { const j = await fetch(u).then(r => r.json()); ok = !!(j && j.response && Array.isArray(j.response.data)); } catch(e){}
  if (!ok) return false;
  ITS_KEY = k; try { localStorage.setItem(KEY+'-itskey', k); } catch(e){}
  updateKeyBtn(); natReload(); renderList();
  players.forEach(p => { if (p.c.src && !p.c.hlsAddr) p.start(); }); // 키 없어서 멈춰 있던 화면 다시 연결
  return true;
}
async function askItsKey(){
  const k = await dialog({ title:'국가교통정보센터 인증키를 넣어 주세요. 이 기기에만 저장돼요.', value:ITS_KEY, okText:'저장', maxLength:100,
    check: v => v && !/^[0-9a-f]{32}$/i.test(v) ? '보통 영문·숫자 32자예요.' : '' });
  if (!k) return;
  toast('인증키 확인 중…');
  if (await setItsKey(k)) toast('인증키 저장됨 · 고속도로·국도 CCTV를 불러와요');
  else toast('인증키를 확인하지 못했어요. 다시 확인해 주세요.');
}
function updateKeyBtn(){ const b = $('#itsKey'); if (b) { b.textContent = ITS_KEY ? '인증키 ✓' : '인증키 입력'; b.classList.toggle('primary', !ITS_KEY); } }
const ITS_API = 'https://openapi.its.go.kr:9443/cctvInfo';
const nat = new Map();   // id -> CCTV
let natMeta = {}; try { natMeta = JSON.parse(localStorage.getItem(KEY+'-nat')) || {}; } catch(e){}
// ID = 종류 + 경도_위도 + 이름 짧은 해시 (같은 위치에 카메라가 여러 대 있는 곳이 있어서 이름도 포함)
const isNat = id => /^[ei]\d+_\d+(_[0-9a-z]+)?$/.test(id);
const nameHash = s => { let x = 5381; for (const ch of String(s)) x = ((x << 5) + x + ch.codePointAt(0)) >>> 0; return x.toString(36).slice(-4); };
const natId = (t,x,y,name) => (t==='ex'?'e':'i') + Math.round(x*1e5) + '_' + Math.round(y*1e5) + '_' + nameHash(String(name||'').trim());
function natItem(t, d){
  const x = +d.coordx, y = +d.coordy;
  return { cctvId:natId(t,x,y,d.cctvname), instlPos:String(d.cctvname||'').trim(), instlAddr:t==='ex'?'고속도로':'국도',
           lat:y, lot:x, hlsAddr:String(d.cctvurl||'').replace(/^http:/,'https:'), src:t };
}
async function fetchNat(t, minX, maxX, minY, maxY){
  if (!ITS_KEY) throw new Error('no key');
  const u = `${ITS_API}?apiKey=${ITS_KEY}&type=${t}&cctvType=1&minX=${minX}&maxX=${maxX}&minY=${minY}&maxY=${maxY}&getType=json`;
  const j = await fetch(u).then(r => r.json());
  return ((j.response && j.response.data) || []).filter(d => d.cctvurl && d.coordx && d.coordy).map(d => natItem(t, d));
}
// ---------- 고속도로·국도 위치 목록 저장 (IndexedDB) : 1주일에 한 번만 새로 받음 ----------
const NAT_G = 0.5, WEEK = 7*24*3600e3, REFRESH_GAP = 10*60e3;
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('busan-cctv', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return {
    get: async k => { try { const db = await open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch(e){ return undefined; } },
    set: async (k, v) => { try { const db = await open(); await new Promise(res => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch(e){} }
  };
})();
const packNat = list => list.map(x => [x.instlPos, x.lot, x.lat, x.hlsAddr]);
const unpackNat = (t, rows) => rows.map(([n,x,y,u]) => ({ cctvId:natId(t,x,y,n), instlPos:n, instlAddr:t==='ex'?'고속도로':'국도', lat:y, lot:x, hlsAddr:u, src:t }));
function mergeNat(list){ return list.map(it => { const c = nat.get(it.cctvId); if (c) { Object.assign(c, it); return c; } nat.set(it.cctvId, it); return it; }); }
const inflight = new Map();
// 저장된 목록이 1주일 안이면 그대로 쓰고(호출 0), 아니면 API로 받아서 저장
// force: 영상 주소가 만료된 것 같을 때 새로 받기 (같은 지역은 10분에 한 번까지만)
async function cachedNat(key, t, box, force){
  if (inflight.has(key)) return inflight.get(key);
  const job = (async () => {
    const c = await idb.get(key), age = c ? Date.now() - c.t : Infinity;
    if (c && (force ? age < REFRESH_GAP : age < WEEK)) return mergeNat(unpackNat(t, c.items));
    try {
      const list = await fetchNat(t, ...box);
      idb.set(key, { t:Date.now(), items:packNat(list) });
      return mergeNat(list);
    } catch(e){ if (c) return mergeNat(unpackNat(t, c.items)); throw e; }
  })();
  inflight.set(key, job); job.finally(() => inflight.delete(key));
  return job;
}
const natTile = (t, gx, gy, force) => cachedNat(`tile:${t}:${gx}_${gy}`, t, [gx*NAT_G, (gx+1)*NAT_G, gy*NAT_G, (gy+1)*NAT_G], force);
function ensureNat(id){ // 아직 지도에서 안 불러온 고속도로·국도 CCTV는 저장된 정보로 자리만 만들어 둠
  if (nat.has(id)) return nat.get(id);
  const m = id.match(/^([ei])(\d+)_(\d+)/); if (!m) return undefined;
  const meta = natMeta[id] || {};
  const c = { cctvId:id, instlPos:meta.instlPos || '고속도로·국도 CCTV', instlAddr:meta.instlAddr || (m[1]==='e'?'고속도로':'국도'),
              lat:+m[3]/1e5, lot:+m[2]/1e5, hlsAddr:'', src:m[1]==='e'?'ex':'its' };
  nat.set(id, c); return c;
}
async function resolveNat(id, force){ // 영상 주소 찾기: 저장된 목록 → 없거나 만료면 그 지역을 새로 받음
  const c = ensureNat(id); if (!c) return null;
  const list = await natTile(c.src, Math.floor(c.lot/NAT_G), Math.floor(c.lat/NAT_G), !!force);
  let best = list.find(x => x.cctvId === id) || (natMeta[id] && list.find(x => x.instlPos === natMeta[id].instlPos));
  if (!best && list.length) best = list.sort((a,b)=>Math.hypot(a.lot-c.lot,a.lat-c.lat)-Math.hypot(b.lot-c.lot,b.lat-c.lat))[0];
  if (best) { Object.assign(c, { instlPos:best.instlPos, hlsAddr:best.hlsAddr }); }
  return c;
}
const $ = s => document.querySelector(s);
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.opacity=0,2200); }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function stampText(){ return new Date().toLocaleString('ko-KR'); }
// 네이버 지도에서 그 위치 보기 (새 탭)
const naverUrl = c => `https://map.naver.com/p?c=${(+c.lot).toFixed(6)},${(+c.lat).toFixed(6)},17,0,0,0,dh`;
const naverBtn = c => c && c.lat ? `<a class="nv" href="${naverUrl(c)}" target="_blank" rel="noopener" title="네이버 지도에서 이 위치 보기">N</a>` : '';
const byId = id => all.find(c => c.cctvId === id) || nat.get(id) || (isNat(id) ? ensureNat(id) : undefined);

async function init(){
  try {
    const res = await fetch(API);
    all = await res.json();
    all.sort((a,b)=>a.instlPos.localeCompare(b.instlPos,'ko'));
    $('#count').textContent = `전체 ${all.length}개 · 체크해서 오른쪽에 추가`;
  } catch(e){
    $('#count').textContent = 'CCTV 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    return;
  }
  selected = selected.filter(id => isNat(id) || byId(id));
  initMap();
  renderList(); renderGrid();
  importFromUrl();
}

// ---------- 지도 ----------
let map = null; const markers = new Map();
const SRC_COLOR = { busan:'#3d7bfd', ex:'#f08c00', its:'#2f9e44' };
function markerStyle(on, src){
  return on ? { radius:9, color:'#fff', weight:2, fillColor:'#ff4d4f', fillOpacity:1 }
            : { radius:src ? 5 : 6, color:'#fff', weight:1, fillColor:SRC_COLOR[src||'busan'], fillOpacity:.9 };
}
function initMap(){
  if (!window.L) { $('#map').innerHTML='<p class="hint" style="padding:12px">지도를 불러오지 못했어요. 목록 탭을 이용해 주세요.</p>'; return; }
  let view = DEFAULT_VIEW;
  try { view = JSON.parse(localStorage.getItem(KEY+'-view')) || view; } catch(e){}
  map = L.map('map', { preferCanvas:true }).setView(view.c, view.z);
  map.on('moveend', () => { try { const c=map.getCenter(); localStorage.setItem(KEY+'-view', JSON.stringify({ c:[+c.lat.toFixed(5), +c.lng.toFixed(5)], z:map.getZoom() })); } catch(e){} });
  // 로컬 파일로 열면 리퍼러가 없어 tile.openstreetmap.org는 차단됨 → 리퍼러 없이도 되는 서버 사용
  const street = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    maxZoom:19, subdomains:'abc', attribution:'&copy; OpenStreetMap contributors, OSM France'
  });
  const street2 = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors, OSM Deutschland'
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19, attribution:'Tiles &copy; Esri'
  });
  street2.addTo(map);
  // 부산시 교통정보센터 소통정보 레이어 (사이트와 같은 색: 초록 25km/h 이상, 주황 15~25, 빨강 15 미만)
  // 사이트와 같이 확대 단계별로 레이어 교체: 넓게 볼 땐 굵은 면, 중간엔 가는 면, 가까이 보면 선
  const trafficLayerFor = z => z <= 12 ? 'bsits:vw_link2_poly_trfc' : z <= 14 ? 'bsits:vw_link1_poly_trfc' : 'bsits:vw_link1_line_trfc';
  const traffic = L.tileLayer.wms('https://its.busan.go.kr/geoserver/bsits/wms', {
    layers:trafficLayerFor(map.getZoom()), format:'image/png', transparent:true, version:'1.1.1',

function placePreview(){
  if (!preview.el || !preview.m) return;
  const r = $('#map').getBoundingClientRect(), pt = map.latLngToContainerPoint(preview.m.getLatLng());
  const x = r.left + pt.x, y = r.top + pt.y, W = preview.el.offsetWidth, H = preview.el.offsetHeight, pad = 8;
  let left = x - W/2, top = y - H - 14;                     // 기본: 점 위쪽
  if (top < pad) top = y + 14;                               // 위가 모자라면 아래쪽
  left = Math.max(pad, Math.min(innerWidth - W - pad, left)); // 화면 밖으로 안 나가게
  top = Math.max(pad, Math.min(innerHeight - H - pad, top));
  preview.el.style.left = left + 'px'; preview.el.style.top = top + 'px';
}
function openPreview(c, m){

    let retried = false;

const openRoads = new Set(), orderCache = new Map();
const natAll = { ex:null, its:null }, natLoading = { ex:false, its:null };
// 도로 이름: 고속도로 "[경부선] …" → 경부고속도로, 국도 "[국도7] …" → 국도 7호선
function roadOf(t, name){
  const m = String(name).match(/^\s*\[([^\]]+)\]/); const b = m ? m[1].trim() : '';
  if (t === 'ex') { if (!b) return { key:'기타', label:'기타 고속도로' };
    return { key:b, label: /지선$/.test(b) ? b.replace(/지선$/,'지선 고속도로') : b.replace(/선$/,'고속도로') }; }
  const n = b.match(/국도\s*(\d+)/); if (n) return { key:'국도'+(+n[1]), label:`국도 ${+n[1]}호선`, no:+n[1] };
  return { key:b || '기타', label:b || '기타', no:9999 };
}
// 도로를 따라 순서대로: 한쪽 끝(가장 먼 점)에서 출발해 가까운 CCTV를 차례로 이어 감
function orderAlongRoad(items){
  if (items.length < 3) return items.slice();
  const cx = items.reduce((s,c)=>s+c.lot,0)/items.length, cy = items.reduce((s,c)=>s+c.lat,0)/items.length;
  const d2 = (a,b) => { const dx=(a.lot-b.lot)*Math.cos(cy*Math.PI/180), dy=a.lat-b.lat; return dx*dx+dy*dy; };
  let start = items.reduce((best,c)=> d2(c,{lot:cx,lat:cy}) > d2(best,{lot:cx,lat:cy}) ? c : best, items[0]);
  start = items.reduce((best,c)=> d2(c,start) > d2(best,start) ? c : best, items[0]); // 반대쪽 끝
  // 북쪽·서쪽(서울 쪽) 끝에서 시작하도록
  const other = items.reduce((best,c)=> d2(c,start) > d2(best,start) ? c : best, items[0]);
  if (other.lat > start.lat + 0.05 || (Math.abs(other.lat-start.lat) <= 0.05 && other.lot < start.lot)) start = other;
  const left = new Set(items); const out = []; let cur = start; left.delete(cur); out.push(cur);
  while (left.size) { let nb = null, nd = Infinity; for (const c of left) { const d = d2(cur,c); if (d < nd) { nd = d; nb = c; } } left.delete(nb); out.push(nb); cur = nb; }
  return out;
}
async function loadNatAll(t){
  if (natAll[t] || natLoading[t]) return;
  natLoading[t] = true; renderList();
  try {
    natAll[t] = await cachedNat('all:'+t, t, [124, 132, 33, 39]);
  } catch(e){ natAll[t] = []; toast('고속도로·국도 목록을 불러오지 못했어요.'); }
  natLoading[t] = false; renderList();
}
function renderRoads(t, q){
  if (!ITS_KEY) return `<p class="hint" style="padding:10px">고속도로·국도 CCTV를 보려면 인증키가 필요해요. <button onclick="askItsKey()">인증키 입력</button></p>`;
  if (!natAll[t]) { loadNatAll(t); return `<p class="hint" style="padding:10px">전국 ${t==='ex'?'고속도로':'국도'} CCTV 목록을 불러오는 중… (몇 초 걸려요)</p>`; }
  const groups = new Map();
  natAll[t].forEach(c => { const r = roadOf(t, c.instlPos); if (!groups.has(r.key)) groups.set(r.key, { ...r, items:[] }); groups.get(r.key).items.push(c); });
  let roads = [...groups.values()];
  roads.sort(t==='its' ? (a,b)=>(a.no-b.no)||a.label.localeCompare(b.label,'ko') : (a,b)=>a.label.localeCompare(b.label,'ko'));
  const match = c => !q || c.instlPos.toLowerCase().includes(q);
  let html = `<p class="sect">${t==='ex'?'고속도로':'국도'} ${roads.length}개 · CCTV ${natAll[t].length}개 · 도로를 누르면 순서대로 펼쳐져요</p>`;
  for (const r of roads) {
    const hit = q ? r.items.filter(match) : r.items;
    if (q && !hit.length && !r.label.toLowerCase().includes(q)) continue;
    const open = openRoads.has(t+':'+r.key) || (q && hit.length && hit.length <= 40);
    const selCnt = r.items.filter(c => selected.includes(c.cctvId)).length;
    html += `<div class="road" data-road="${t}:${r.key}"><span class="arr">${open?'▾':'▸'}</span><b>${r.label}</b>${selCnt?`<span class="sc">${selCnt}</span>`:''}<span class="cnt">${r.items.length}개</span></div>`;
    if (open) {
      const ck = t+':'+r.key;
      if (!orderCache.has(ck)) orderCache.set(ck, orderAlongRoad(r.items));
      const ordered = orderCache.get(ck);
      html += '<div class="road-items">' + ordered.map((c,i) => !match(c) && q && !r.label.toLowerCase().includes(q) ? '' : `
        <div class="item">
          <span class="seq">${i+1}</span>
          <input type="checkbox" data-id="${c.cctvId}" ${selected.includes(c.cctvId)?'checked':''}>
          <div class="name" data-toggle="${c.cctvId}">${c.instlPos.replace(/^\s*\[[^\]]+\]\s*/,'')}</div>
          <button class="go" data-go="${c.cctvId}" title="오른쪽에 지도와 영상 보기">📍</button>${naverBtn(c)}
        </div>`).join('') + '</div>';
    }
  }
  return html;
}

// 목록에서 ≡ 를 잡고 끌어서 순서 바꾸기 (마우스·터치 공통)
// 잡은 항목은 반투명 잔상(ghost)이 손가락을 따라오고, 원래 자리는 빈 칸(미리보기)으로 바뀌어 놓일 위치를 보여줌
let drag = null;
const listEl = () => $('#list');
function selItems(){ return [...document.querySelectorAll('#list [data-sel]')]; }
// 다른 항목이 부드럽게 밀려나도록 (FLIP 애니메이션)
function animateShift(mutate){
  const items = selItems().filter(x => x !== drag.it);
  const before = new Map(items.map(x => [x, x.offsetTop]));
  mutate();
  items.forEach(x => {
    const dy = before.get(x) - x.offsetTop; if (!dy) return;
    x.style.transition = 'none'; x.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => { x.style.transition = 'transform .16s ease'; x.style.transform = ''; });
  });
}
listEl().addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h) return;
  e.preventDefault();
  const it = h.closest('[data-sel]'), r = it.getBoundingClientRect();
  const ghost = it.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width:r.width+'px', left:r.left+'px', top:r.top+'px' });
  document.body.appendChild(ghost);
  drag = { it, ghost, pid:e.pointerId, scroll:null, y:e.clientY, grab:e.clientY - r.top, h:r.height };
  h.setPointerCapture(e.pointerId);
  it.classList.add('placeholder');
});
function dragMove(y){
  if (!drag) return;
  drag.y = y;
  drag.ghost.style.top = (y - drag.grab) + 'px';
  // 잔상의 가운데가 어느 항목의 절반을 넘었는지로 놓일 자리 결정
  const L = listEl(), lr = L.getBoundingClientRect();
  const center = (y - drag.grab + drag.h/2) - lr.top + L.scrollTop;
  const others = selItems().filter(x => x !== drag.it);
  let target = null;
  for (const x of others) { if (center < x.offsetTop + x.offsetHeight/2) { target = x; break; } }
  const needMove = target ? drag.it.nextElementSibling !== target : (others.length && others[others.length-1].nextElementSibling !== drag.it);
  if (needMove) animateShift(() => target ? target.before(drag.it) : others[others.length-1].after(drag.it));
  // 목록 위·아래 끝에 가까우면 자동 스크롤
  const edge = 40, v = y < lr.top + edge ? -8 : y > lr.bottom - edge ? 8 : 0;
  clearInterval(drag.scroll); drag.scroll = v ? setInterval(() => { L.scrollTop += v; dragMove(drag.y); }, 30) : null;
}
listEl().addEventListener('pointermove', e => { if (drag && e.pointerId === drag.pid) dragMove(e.clientY); });
function dragEnd(e){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  clearInterval(drag.scroll);
  const d = drag; drag = null;
  // 잔상이 빈 칸으로 쏙 들어가는 마무리 애니메이션
  const r = d.it.getBoundingClientRect();
  d.ghost.style.transition = 'top .15s ease, opacity .15s ease, box-shadow .15s ease';
  d.ghost.style.top = r.top + 'px'; d.ghost.style.boxShadow = 'none';
  setTimeout(() => {
    d.ghost.remove(); d.it.classList.remove('placeholder');
    // 화면에 보이는 선택 항목의 새 순서를 원래 자리들에 다시 채워 넣기 (검색 중일 때도 안전)
    const shown = selItems().map(x => x.dataset.sel);
    const slots = selected.map((id,i) => shown.includes(id) ? i : -1).filter(i => i >= 0);
    const next = selected.slice(); slots.forEach((slot,k) => next[slot] = shown[k]);
    if (next.join() !== selected.join()) { selected = next; save(); renderGrid(); }
    renderList();
  }, 160);
}
listEl().addEventListener('pointerup', dragEnd);
listEl().addEventListener('pointercancel', dragEnd);

function makeTile(c){
  const el = document.createElement('div'); el.className='tile'; el.draggable=true; el.dataset.id=c.cctvId;
  el.innerHTML = `<video muted playsinline autoplay></video><div class="msg">연결 중…</div>
    <div class="bar">${dirHtml(c.cctvId)}<span class="nm" title="눌러서 지도에서 위치 보기${c.instlAddr ? ' · '+c.instlAddr : ''}">${c.instlPos}</span>
    ${naverBtn(c)}<button data-act="reload" title="다시 연결">↻</button><button data-act="del" title="빼기">✕</button></div>`;
  const video = el.querySelector('video'), msg = el.querySelector('.msg');
  const p = { el, video, hls:null, c };
  const start = async () => {
    p.hls && p.hls.destroy(); p.hls = null; msg.textContent='연결 중…'; msg.style.display='flex';
    // 고속도로·국도 CCTV: 영상 주소에 유효시간이 있어서 처음이거나 끊겼으면 새 주소를 받아 옴
    if (c.src && (!c.hlsAddr || p.failed)) {
      try { await resolveNat(c.cctvId, p.failed); el.querySelector('.bar span').textContent = c.instlPos; save(); } catch(e){}
      if (players.get(c.cctvId) !== p) return;
    }
    if (c.src && !ITS_KEY) { msg.textContent='인증키를 넣으면 볼 수 있어요 (위쪽 "인증키 입력")'; return; }
    if (!c.hlsAddr) { msg.textContent='영상 주소를 받지 못했어요 · 30초 후 재시도'; p.failed = true;
      clearTimeout(p.retry); p.retry = setTimeout(() => { if (players.get(c.cctvId) === p) start(); }, 30000); return; }
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ liveSyncDurationCount:2, manifestLoadingMaxRetry:4, levelLoadingMaxRetry:4, fragLoadingMaxRetry:4 });
      hls.loadSource(c.hlsAddr); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { p.failed = false; });
      hls.on(Hls.Events.ERROR, (_,d) => { if (d.fatal) {
        const quick = c.src && !p.failed; p.failed = true;
        msg.textContent = quick ? '다시 연결 중…' : '영상 신호 없음 · 30초 후 자동 재연결'; msg.style.display='flex';
        clearTimeout(p.retry); p.retry = setTimeout(() => { if (players.get(c.cctvId) === p) start(); }, quick ? 1500 : 30000);
      } });
      p.hls = hls;
    } else { video.src = c.hlsAddr; } // Safari 기본 HLS
    video.play().catch(()=>{});
  };
  p.start = start;
  video.addEventListener('playing', () => msg.style.display='none');
  video.addEventListener('click', () => el.classList.contains('big') ? closeBig() : openBig(el));
  el.querySelector('.bar').addEventListener('click', e => {
    if (e.target.classList.contains('nm')) { focusOnMap(c); return; } // 이름 누르면 지도에서 위치 보기
    const db = e.target.closest('.dir'); if (db) { cycleDir(c.cctvId, db); return; }
    const act = e.target.dataset.act;
    if (act==='reload') start();
    if (act==='del') { closeBig(); selected = selected.filter(x=>x!==c.cctvId); save(); renderGrid(); renderList(); }
  });
  // 드래그로 순서 바꾸기
  el.addEventListener('dragstart', () => el.classList.add('dragging'));
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); selected=[...document.querySelectorAll('#grid .tile')].map(t=>t.dataset.id); save(); renderList(); });
  el.addEventListener('dragover', e => { e.preventDefault(); const d=document.querySelector('.tile.dragging'); if(!d||d===el) return;
    const r=el.getBoundingClientRect(); const after = (e.clientX - r.left) > r.width/2;
    el.parentNode.insertBefore(d, after ? el.nextSibling : el); });
  start();
  players.set(c.cctvId, p);
  return p;
}

// 영상 한 프레임 + 이름/시각을 캔버스에 그리기
const SCALE = 2; // 원본이 320x240이라 2배로 키워 저장
function drawFrame(ctx, p, x, y, w, h){
  ctx.fillStyle='#000'; ctx.fillRect(x,y,w,h);
  const v=p.video;
  if (v.videoWidth) ctx.drawImage(v, x, y, w, h);
  else { ctx.fillStyle='#888'; ctx.font=`${14*SCALE/2+6}px sans-serif`; ctx.fillText('영상 없음', x+12, y+h/2); }
  const dv = dirs[p.c.cctvId], label = `${dv !== undefined ? DIR_ARROW[dv]+' ' : ''}${p.c.instlPos}  ·  ${stampText()}`;
  ctx.font = `bold ${Math.round(w/32)}px sans-serif`;
  const pad = Math.round(w/80), th = Math.round(w/32)+pad*2;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x, y+h-th, w, th);
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(label, x+pad, y+h-th/2);
}
function download(canvas, name){
  canvas.toBlob(b => { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }, 'image/png');
}
function safe(s){ return s.replace(/[\\/:*?"<>|\s]+/g,'_'); }
function captureAll(){
  const list = selected.map(id=>players.get(id)).filter(Boolean);
  if (!list.length) { toast('선택된 CCTV가 없어요.'); return; }
  const cols = Math.min(+$('#cols').value, list.length), rows = Math.ceil(list.length/cols);
  const w=320*SCALE, h=180*SCALE, gap=8; // 16:9
  const cv=document.createElement('canvas'); cv.width=cols*w+(cols-1)*gap; cv.height=rows*h+(rows-1)*gap;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#111'; ctx.fillRect(0,0,cv.width,cv.height);
  try {
    list.forEach((p,i)=> drawFrame(ctx, p, (i%cols)*(w+gap), Math.floor(i/cols)*(h+gap), w, h));
    download(cv, `CCTV_모아보기_${stamp()}.png`); toast('캡처 저장됨');
  } catch(e){ toast('이 브라우저에서는 캡처가 막혀 있어요. 크롬이나 엣지로 열어 주세요.'); }
}

// 간단한 입력/확인 창 (브라우저 기본 팝업 대신)
function dialog({ title, value=null, okText='확인', check=null, maxLength=30, altText=null }){
  return new Promise(res => {
    $('#dlgTitle').textContent = title; $('#dlgOk').textContent = okText; $('#dlgNote').textContent = '';
    const alt = $('#dlgAlt'); alt.style.display = altText ? '' : 'none'; alt.textContent = altText || ''; alt.onclick = () => done('alt');
    const inp = $('#dlgInput'); inp.maxLength = maxLength; inp.style.display = value === null ? 'none' : ''; inp.value = value || '';
    $('#dlg').classList.add('show'); if (value !== null) setTimeout(() => { inp.focus(); inp.select(); }, 30);
    const upd = () => { if (check) $('#dlgNote').textContent = check(inp.value.trim()) || ''; };
    inp.oninput = upd; upd();
    const done = v => { $('#dlg').classList.remove('show'); inp.oninput = null; $('#dlgOk').onclick = $('#dlgCancel').onclick = alt.onclick = inp.onkeydown = null; res(v); };
    $('#dlgOk').onclick = () => { const v = inp.value.trim(); if (value !== null && !v) { inp.focus(); return; } done(value === null ? true : v); };
    $('#dlgCancel').onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') $('#dlgOk').click(); if (e.key === 'Escape') done(null); };
  });
}

// ---------- QR·링크로 설정 보내기 / 받기 ----------
// 링크 형식: ...?s=<압축 설정>  (이름|열|위도,경도,줌|CCTV번호.번호.번호…)
function encodeSettings(name, s, key){
  const ids = (s.selected||[]).map(id => isNat(id) ? id : String(+id.replace(/\D/g,''))).join('.');
  const v = s.view ? `${s.view.c[0]},${s.view.c[1]},${s.view.z}` : '';
  const dd = (s.selected||[]).map(id => s.dirs && s.dirs[id] !== undefined ? s.dirs[id] : '-').join('');
  return [name, s.cols||'', v, ids, s.wide?'1':'', key||'', /\d/.test(dd) ? dd : ''].map(encodeURIComponent).join('|');
}
function decodeSettings(str){
  const [name, cols, v, ids, wide, key, dd] = str.split('|').map(decodeURIComponent);
  const s = { selected:(ids||'').split('.').filter(Boolean).map(n => isNat(n) ? n : 'CTV' + n.padStart(7,'0')), cols:cols||DEFAULT_COLS, wide:wide==='1', dirs:{} };
  (dd||'').split('').forEach((ch,i) => { if (/[0-7]/.test(ch) && s.selected[i]) s.dirs[s.selected[i]] = +ch; });
  if (v) { const [a,b,z] = v.split(',').map(Number); if (!isNaN(a)&&!isNaN(b)&&!isNaN(z)) s.view = { c:[a,b], z }; }
  return { name: name || '받은 설정', s, key: key || '' };
}
function makeQR(){
  const name = $('#preset').value || '공유 설정';
  const s = currentSettings(); // 지금 화면 그대로 보냄
  $('#qrKeyWrap').style.display = ITS_KEY ? 'block' : 'none';
  const url = location.origin + location.pathname + '?s=' + encodeSettings(name, s, ITS_KEY && $('#qrKey').checked ? ITS_KEY : '');
  $('#qrTitle').textContent = `"${name}" 설정 (${s.selected.length}개 CCTV)`;
  $('#qrLink').value = url;
  if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(url); q.make(); $('#qrImg').innerHTML = q.createSvgTag({ cellSize:4, margin:2, scalable:true }); }
  else $('#qrImg').textContent = 'QR을 만들지 못했어요. 링크를 복사해서 보내 주세요.';
  $('#qrBox').classList.add('show');
}
$('#presetQR').addEventListener('click', makeQR);
$('#qrKey').addEventListener('change', makeQR);

// 링크로 열었을 때: 설정 추가할지 묻고, 주소창은 깔끔하게 정리
async function importFromUrl(){
  const raw = new URLSearchParams(location.search).get('s'); if (!raw) return;
  history.replaceState(null, '', location.pathname);
  let got; try { got = decodeSettings(raw); } catch(e){ toast('설정 링크를 읽지 못했어요.'); return; }
  const name = await dialog({ title:`받은 설정(${got.s.selected.length}개 CCTV)을 이 기기에 추가할까요? 이름을 정해 주세요.`, value:got.name, okText:'추가',
    check: v => presets[v] ? `이 기기에 있는 "${v}" 설정을 덮어써요.` : '' });
  if (!name) return;
  if (got.key && got.key !== ITS_KEY) await setItsKey(got.key); // 같이 온 인증키 저장
  presets[name] = got.s; renderPresets(name); savePresets();
  applySettings(got.s); toast(`"${name}" 추가됨`);
}

// ---------- 오른쪽 위치 패널: 목록의 📍 → 오른쪽에 지도 + 영상, 지도의 점을 누르면 그 CCTV로 바뀌고 추가 가능 ----------
const loc = { c:null, hls:null, map:null, layer:null, marks:new Map(), loaded:new Set(), timer:null };
// 왼쪽 영역 크기가 바뀌면(지도 크게/작게, 창 크기) 패널도 바로 옆으로 따라 붙음
function placeLoc(){
  const el = $('#loc'), r = document.querySelector('aside').getBoundingClientRect();
  if (innerWidth <= 760) { el.style.left = '0px'; el.style.width = ''; }
  else { el.style.left = r.right + 'px'; el.style.width = Math.max(300, Math.min(480, innerWidth - r.right)) + 'px'; }
  if (loc.map) loc.map.invalidateSize();
}
if (window.ResizeObserver) new ResizeObserver(() => { if ($('#loc').classList.contains('show')) placeLoc(); }).observe(document.querySelector('aside'));
addEventListener('resize', () => { if ($('#loc').classList.contains('show')) placeLoc(); });
function locStyle(c){ return markerStyle(selected.includes(c.cctvId), c.src); }
function locBtn(){ if (!loc.c) return; const on = selected.includes(loc.c.cctvId), b = $('#locAdd');
  b.classList.toggle('on', on); b.textContent = on ? '✓ 모아보기에 있음 · 빼기' : '+ 모아보기에 추가'; }
function locRefresh(){ // 선택 상태가 바뀌면 버튼·점 색 갱신
  if (!$('#loc').classList.contains('show')) return;
  locBtn(); for (const [id,m] of loc.marks) { const c = byId(id); if (c) { m.setStyle(locStyle(c)); if (loc.c && id === loc.c.cctvId) m.setStyle({ radius:11, weight:3, color:'#ffd43b' }); } }
}
async function locPlay(c){
  loc.c = c; $('#locNaver').href = naverUrl(c); $('#locName').textContent = c.instlPos; $('#locAddr').textContent = c.instlAddr || ''; locBtn();
  const v = document.querySelector('.loc-vid video'), msg = $('#locMsg'); msg.style.display = 'flex'; msg.textContent = '연결 중…';
  if (loc.hls) { loc.hls.destroy(); loc.hls = null; }
  if (c.src) { if (!ITS_KEY) { msg.textContent = '인증키를 넣으면 볼 수 있어요'; return; }
    if (!c.hlsAddr) { try { await resolveNat(c.cctvId); } catch(e){} } if (loc.c !== c) return; }
  if (!c.hlsAddr) { msg.textContent = '영상 주소를 받지 못했어요'; return; }
  let retried = false;
  if (window.Hls && Hls.isSupported()) {
    const hl = new Hls({ liveSyncDurationCount:2 }); loc.hls = hl; hl.loadSource(c.hlsAddr); hl.attachMedia(v);
    hl.on(Hls.Events.ERROR, async (_,d) => { if (!d.fatal) return;
      if (c.src && !retried) { retried = true; msg.textContent = '다시 연결 중…'; try { await resolveNat(c.cctvId, true); if (loc.hls === hl) { hl.loadSource(c.hlsAddr); return; } } catch(e){} }
      msg.textContent = '영상 신호 없음'; });
  } else v.src = c.hlsAddr;
  v.play().catch(()=>{});
  locRefresh();
}
document.querySelector('.loc-vid video').addEventListener('playing', () => $('#locMsg').style.display = 'none');
document.querySelector('.loc-vid video').addEventListener('click', () => { if (loc.c) openPreviewBig(loc.c); });
function locDraw(){ // 지금 보이는 범위의 CCTV만 점으로 그림
  if (!loc.map) return;
  const b = loc.map.getBounds().pad(0.2), pool = all.concat([...nat.values()].filter(c => c.lat));
  const want = new Set();
  for (const c of pool) { if (!b.contains([c.lat, c.lot])) continue; want.add(c.cctvId);
    if (loc.marks.has(c.cctvId)) continue;
    const m = L.circleMarker([c.lat, c.lot], { ...locStyle(c), bubblingMouseEvents:false }).addTo(loc.layer)
      .bindTooltip(c.instlPos, { direction:'top', offset:[0,-6] });
    m.on('click', () => locPlay(c));
    loc.marks.set(c.cctvId, m); }
  for (const [id,m] of loc.marks) if (!want.has(id)) { loc.layer.removeLayer(m); loc.marks.delete(id); }
  locRefresh();
}
function locLoadNat(){ // 패널 지도에 보이는 지역의 고속도로·국도 CCTV 불러오기
  if (!ITS_KEY || !loc.map || loc.map.getZoom() < 10 || !(natOn || (loc.c && loc.c.src))) { locDraw(); return; }
  const b = loc.map.getBounds(), G = 0.5; const jobs = [];
  for (let gx = Math.floor(b.getWest()/G); gx <= Math.floor(b.getEast()/G); gx++)
    for (let gy = Math.floor(b.getSouth()/G); gy <= Math.floor(b.getNorth()/G); gy++) {
      const k = gx+'_'+gy; if (loc.loaded.has(k)) continue; loc.loaded.add(k);
      ['ex','its'].forEach(t => jobs.push(natTile(t, gx, gy)
        .catch(() => loc.loaded.delete(k))));
    }
  locDraw(); if (jobs.length) Promise.all(jobs).then(locDraw);
}
function openLoc(c){
  closePreview(); placeLoc(); $('#loc').classList.add('show');
  if (!loc.map) {
    loc.map = L.map('locMap', { preferCanvas:true, zoomControl:true }).setView([c.lat, c.lot], 15);
    L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap contributors' }).addTo(loc.map);
    L.tileLayer.wms('https://its.busan.go.kr/geoserver/bsits/wms', { layers:'bsits:vw_link1_line_trfc', format:'image/png', transparent:true, version:'1.1.1', env:'gradeType:trfc', opacity:.8 }).addTo(loc.map);
    loc.layer = L.layerGroup().addTo(loc.map);
    loc.map.on('moveend', () => { clearTimeout(loc.timer); loc.timer = setTimeout(locLoadNat, 200); });
  } else { loc.map.invalidateSize(); loc.map.setView([c.lat, c.lot], Math.max(loc.map.getZoom(), 14)); }
  setTimeout(() => { loc.map.invalidateSize(); locLoadNat(); }, 60);
  locPlay(c);
}
function closeLoc(){ $('#loc').classList.remove('show'); if (loc.hls) { loc.hls.destroy(); loc.hls = null; } loc.c = null; }
$('#locClose').addEventListener('click', closeLoc);
$('#locAdd').addEventListener('click', () => { if (loc.c) toggle(loc.c.cctvId); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.tile.big') && $('#loc').classList.contains('show')) closeLoc(); });

// ---------- 경로로 CCTV 고르기: 출발·경유·도착 → 도로 경로(OSRM) → 경로 근처 CCTV를 가는 순서대로 ----------
const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
const route = { open:false, pts:[null, null], marks:[], line:null, hits:[], layer:null, timer:null, seq:0 };
const PT_COLOR = i => i === 0 ? '#2f9e44' : i === route.pts.length-1 ? '#e03131' : '#7048e8';
const PT_TAG = i => i === 0 ? '출' : i === route.pts.length-1 ? '도' : String(i);
function routeOpen(){
  route.open = true; showTab('map'); $('#routeBox').classList.remove('hide');
  document.querySelector('.route-toggle')?.classList.add('on');
  if (!route.layer) route.layer = L.layerGroup().addTo(map);
  const nb = $('#rbNat'); nb.disabled = !ITS_KEY; nb.checked = !!ITS_KEY && natOn; nb.parentElement.title = ITS_KEY ? '' : '인증키를 넣으면 쓸 수 있어요';
  routeRenderPts(); setTimeout(() => map.invalidateSize(), 50);
}
function routeClose(){ route.open = false; $('#routeBox').classList.add('hide'); document.querySelector('.route-toggle')?.classList.remove('on'); routeClearAll(); setTimeout(() => map.invalidateSize(), 50); }
function routeClearAll(){ route.pts = [null, null]; route.hits = []; if (route.layer) route.layer.clearLayers(); route.marks = []; route.line = null; routeRenderPts(); $('#rbInfo').textContent = ''; $('#rbApply').disabled = true; }
function routeRenderPts(){
  const box = $('#rbPts');
  box.innerHTML = route.pts.map((p,i) => `<div class="rb-pt" data-i="${i}">
      <span class="tag" style="background:${PT_COLOR(i)}">${PT_TAG(i)}</span>
      <input type="text" placeholder="${i===0?'출발지':i===route.pts.length-1?'도착지':'경유지'} 검색 또는 지도 클릭" value="${p ? p.name.replace(/"/g,'&quot;') : ''}" class="${p?'set':''}">
      ${(i>0 && i<route.pts.length-1) || p ? `<button class="x" title="지우기">✕</button>` : ''}
    </div>`).join('');
  routeDrawPins();
}
function routeDrawPins(){
  route.marks.forEach(m => route.layer && route.layer.removeLayer(m)); route.marks = [];
  if (!route.layer) return;
  route.pts.forEach((p,i) => { if (!p) return;
    const m = L.marker([p.lat, p.lng], { draggable:true, zIndexOffset:1000,
      icon:L.divIcon({ className:'', html:`<div class="route-pin" style="background:${PT_COLOR(i)}">${PT_TAG(i)}</div>`, iconSize:[24,24], iconAnchor:[12,12] }) }).addTo(route.layer);
    m.on('dragend', () => { const ll = m.getLatLng(); route.pts[i] = { ...p, lat:ll.lat, lng:ll.lng, name:p.name.startsWith('지도에서') ? `지도에서 고른 위치 (${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)})` : p.name + ' (옮김)' }; routeRenderPts(); routeCompute(); });
    route.marks.push(m); });
}
function routeSetPt(i, p){ route.pts[i] = p; routeRenderPts(); routeCompute(); }
function routeMapClick(ll){
  const p = { lat:ll.lat, lng:ll.lng, name:`지도에서 고른 위치 (${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)})` };
  const empty = route.pts.findIndex(x => !x);
  if (empty >= 0) routeSetPt(empty, p);
  else { route.pts.push(p); routeRenderPts(); routeCompute(); } // 다 찼으면 새 도착지로 (이전 도착지는 경유지가 됨)
}
$('#rbAddVia').addEventListener('click', () => { route.pts.splice(route.pts.length-1, 0, null); routeRenderPts(); });
$('#rbClose').addEventListener('click', routeClose);
$('#rbClear').addEventListener('click', routeClearAll);
['rbRange','rbGap','rbNat'].forEach(id => $('#'+id).addEventListener('change', () => routeCompute(true)));
$('#rbPts').addEventListener('click', e => {
  const row = e.target.closest('.rb-pt'); if (!row) return; const i = +row.dataset.i;
  if (e.target.classList.contains('x')) { if (i>0 && i<route.pts.length-1) route.pts.splice(i,1); else route.pts[i] = null; routeRenderPts(); routeCompute(); return; }
  const s = e.target.closest('[data-sug]'); if (s) { const p = row._sug[+s.dataset.sug]; routeSetPt(i, p); map.setView([p.lat, p.lng], Math.max(map.getZoom(), 14)); }
});
// 장소 검색: CCTV 이름 + OpenStreetMap 장소 검색
let sugTimer = null, sugSeq = 0;
$('#rbPts').addEventListener('input', e => {
  if (e.target.tagName !== 'INPUT') return;
  const row = e.target.closest('.rb-pt'), q = e.target.value.trim(); clearTimeout(sugTimer);
  row.querySelector('.rb-sug')?.remove(); if (q.length < 2) return;
  sugTimer = setTimeout(() => routeSuggest(row, q), 450);
});
$('#rbPts').addEventListener('keydown', e => { if (e.key === 'Escape') e.target.closest('.rb-pt')?.querySelector('.rb-sug')?.remove(); });
async function routeSuggest(row, q){
  const seq = ++sugSeq, ql = q.toLowerCase();
  const cctv = all.concat([...nat.values()]).filter(c => c.lat && c.instlPos.toLowerCase().includes(ql)).slice(0, 5)
    .map(c => ({ lat:c.lat, lng:c.lot, name:c.instlPos, sub:'CCTV · ' + (c.instlAddr||''), kind:'CCTV' }));
  const show = list => { row.querySelector('.rb-sug')?.remove(); if (!list.length) return; row._sug = list;
    const d = document.createElement('div'); d.className = 'rb-sug';
    d.innerHTML = list.map((s,i) => `<div data-sug="${i}"><span class="k">${s.kind}</span>${s.name}<small>${s.sub||''}</small></div>`).join('');
    row.appendChild(d); };
  show(cctv);
  try {
    const b = map.getBounds();
    const u = `https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=kr&accept-language=ko&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}&q=${encodeURIComponent(q)}`;
    const r = await fetch(u).then(x => x.json()); if (seq !== sugSeq) return;
    const places = r.map(x => { const parts = x.display_name.split(',').map(s=>s.trim()); return { lat:+x.lat, lng:+x.lon, name:parts[0], sub:parts.slice(1,4).join(' '), kind:'장소' }; });
    show(cctv.concat(places));
    if (!cctv.length && !places.length) { row.querySelector('.rb-sug')?.remove(); const d = document.createElement('div'); d.className='rb-sug'; d.innerHTML = '<div>검색 결과가 없어요. 지도를 직접 눌러 찍어 주세요.</div>'; row.appendChild(d); }
  } catch(e){}
}
document.addEventListener('click', e => { if (!e.target.closest('.rb-pt')) document.querySelectorAll('.rb-sug').forEach(x => x.remove()); });
// 경로 계산 + 근처 CCTV 찾기
function routeCompute(keepRoute){ clearTimeout(route.timer); route.timer = setTimeout(() => routeRun(keepRoute), 300); }
async function routeRun(keepRoute){
  const pts = route.pts.filter(Boolean), seq = ++route.seq;
  if (!route.pts[0] || !route.pts[route.pts.length-1] || pts.length < 2) {
    if (route.line) { route.layer.removeLayer(route.line); route.line = null; } route.hits = []; routeShowHits();
    $('#rbInfo').textContent = route.pts[0] || route.pts[route.pts.length-1] ? '출발지와 도착지를 모두 정해 주세요.' : ''; $('#rbApply').disabled = true; return; }
  let geo = keepRoute && route.geo;
  if (!geo) {
    $('#rbInfo').textContent = '경로 계산 중…';
    try {
      const u = OSRM + pts.map(p => `${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';') + '?overview=full&geometries=geojson';
      const j = await fetch(u).then(r => r.json()); if (seq !== route.seq) return;
      if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.code);
      geo = route.geo = { coords:j.routes[0].geometry.coordinates, km:j.routes[0].distance/1000, min:j.routes[0].duration/60 };
    } catch(e){ if (seq === route.seq) { $('#rbInfo').textContent = '경로를 찾지 못했어요. 점 위치를 조금 옮겨 보세요. (길찾기 서버가 잠시 안 될 수도 있어요)'; $('#rbApply').disabled = true; } return; }
    if (route.line) route.layer.removeLayer(route.line);
    route.line = L.polyline(geo.coords.map(([x,y]) => [y,x]), { color:'#7048e8', weight:6, opacity:.75 }).addTo(route.layer);
    route.line.bringToBack();
    if (!keepRoute) map.fitBounds(route.line.getBounds().pad(0.15));
  }
  // 고속도로·국도 CCTV: 경로가 지나는 지역 목록 (저장된 것 우선, 없으면 받아 옴)
  if ($('#rbNat').checked && ITS_KEY) {
    const cells = new Set(geo.coords.map(([x,y]) => Math.floor(x/NAT_G)+'_'+Math.floor(y/NAT_G)));
    $('#rbInfo').textContent = '경로 근처 고속도로·국도 CCTV 확인 중…';
    await Promise.all([...cells].flatMap(k => { const [gx,gy] = k.split('_').map(Number); return ['ex','its'].map(t => natTile(t, gx, gy).catch(()=>[])); }));
    if (seq !== route.seq) return;
  }
  const range = +$('#rbRange').value, gap = +$('#rbGap').value;
  const pool = all.concat($('#rbNat').checked ? [...nat.values()].filter(c => c.hlsAddr) : []);
  let hits = matchRoute(geo.coords, pool, range);
  if (gap) { const out = []; for (const h of hits) if (!out.length || h.along - out[out.length-1].along >= gap) out.push(h); hits = out; }
  route.hits = hits; routeShowHits();
  const incOnRoute = incAll().filter(x => matchRoute(geo.coords, [{ cctvId:x.id, lat:x.lat, lot:x.lng }], 300).length);
  $('#rbInfo').innerHTML = `거리 <b>${geo.km.toFixed(1)}km</b> · 약 ${Math.round(geo.min)}분 (교통상황 미반영) · CCTV <b>${hits.length}개</b>`
    + (incOnRoute.length ? `<br><span style="color:#ff8a8a">⚠ 경로 위 돌발상황 ${incOnRoute.length}건: ${incOnRoute.slice(0,3).map(x => x.type + ' ' + x.place).join(', ')}${incOnRoute.length>3?' 외':''}</span>` : '');
  $('#rbApply').disabled = !hits.length;
}
function matchRoute(coords, pool, range){
  const lat0 = coords[0][1], kx = 111320*Math.cos(lat0*Math.PI/180), ky = 110540;
  const P = coords.map(([x,y]) => [x*kx, y*ky]), cum = [0];
  for (let i = 1; i < P.length; i++) cum[i] = cum[i-1] + Math.hypot(P[i][0]-P[i-1][0], P[i][1]-P[i-1][1]);
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity; P.forEach(([x,y]) => { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); });
  const res = [], seen = new Set();
  for (const c of pool) {
    if (seen.has(c.cctvId)) continue;
    const qx = c.lot*kx, qy = c.lat*ky;
    if (qx < minX-range || qx > maxX+range || qy < minY-range || qy > maxY+range) continue;
    let best = Infinity, along = 0;
    for (let i = 1; i < P.length; i++) {
      const ax=P[i-1][0], ay=P[i-1][1], vx=P[i][0]-ax, vy=P[i][1]-ay, l2 = vx*vx+vy*vy;
      const t = l2 ? Math.max(0, Math.min(1, ((qx-ax)*vx + (qy-ay)*vy)/l2)) : 0;
      const d = Math.hypot(qx-(ax+t*vx), qy-(ay+t*vy));
      if (d < best) { best = d; along = cum[i-1] + t*Math.sqrt(l2); }
    }
    if (best <= range) { res.push({ c, along, d:best }); seen.add(c.cctvId); }
  }
  return res.sort((a,b) => a.along - b.along);
}
function routeShowHits(){
  if (!route.layer) return;
  (route.hitMarks || []).forEach(m => route.layer.removeLayer(m));
  route.hitMarks = route.hits.map((h,i) => L.circleMarker([h.c.lat, h.c.lot], { radius:11, color:'#ffd43b', weight:3, fill:false, interactive:false }).addTo(route.layer)
    .bindTooltip(String(i+1), { permanent:true, direction:'center', className:'route-num' }));
}
$('#rbApply').addEventListener('click', async () => {
  const ids = route.hits.map(h => h.c.cctvId); if (!ids.length) return;
  const ok = await dialog({ title:`모아보기를 경로의 CCTV ${ids.length}개로 바꿀까요? (가는 순서대로) 지금 화면을 남기려면 먼저 "설정 저장"을 해 두세요.`, okText:'바꾸기' });
  if (!ok) return;
  closeBig(); selected = ids; save(); renderGrid(); renderList();
  toast(`경로 CCTV ${ids.length}개를 넣었어요 · "설정 저장"으로 이름 붙여 두세요`);
});

// ---------- 영상 아래 이름을 누르면 왼쪽 지도가 그 위치로 이동 ----------
function focusOnMap(c){
  if (!map || !c || !c.lat) return;
  closeBig(); closePreview(); showTab('map');
  map.setView([c.lat, c.lot], Math.max(map.getZoom(), 15), { animate:true });
  if (innerWidth <= 760) $('#map').scrollIntoView({ behavior:'smooth', block:'start' }); // 휴대폰: 지도가 위에 있으니 위로 스크롤
  // 위치를 알아보기 쉽게 잠깐 깜빡이는 표시
  const ring = L.circleMarker([c.lat, c.lot], { radius:16, color:'#ffd43b', weight:4, fill:false, interactive:false, className:'focus-ring' }).addTo(map);
  setTimeout(() => map.removeLayer(ring), 3800);
  const m = markers.get(c.cctvId); if (m) m.bringToFront();
}

// ---------- 네이버 지도 길찾기 주소 → 출발·경유·도착 ----------
// 지원: map.naver.com/p/directions/{출발}/{도착}/{경유}/car (좌표는 경위도 또는 웹메르카토르 미터)
//       m.map.naver.com/route.nhn?sx=&sy=&ex=&ey=…,  nmap://route/car?slat=&slng=&dlat=&dlng=&v1lat=…
function mercToLL(x, y){ return { lng: x/20037508.34*180, lat: Math.atan(Math.exp(y/20037508.34*Math.PI))*360/Math.PI - 90 }; }
function toLL(x, y){
  x = +x; y = +y; if (!isFinite(x) || !isFinite(y)) return null;
  if (x > 120 && x < 135 && y > 30 && y < 45) return { lng:x, lat:y };               // 경도,위도
  if (y > 120 && y < 135 && x > 30 && x < 45) return { lng:y, lat:x };               // 위도,경도
  if (x > 1.3e7 && x < 1.5e7 && y > 3.4e6 && y < 5.7e6) return mercToLL(x, y);       // 웹메르카토르(m)
  return null;
}
// 네이버 웹 길찾기 주소의 압축 좌표 (예: 3AGZ15) : 62진수(0-9a-zA-Z) ÷ 10,000,000 − 200 = 경도/위도
const B62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
function naverNum(s){
  s = String(s||'').trim();
  if (/^[0-9a-zA-Z]+$/.test(s) && /[a-zA-Z]/.test(s)) { let v = 0; for (const ch of s) v = v*62 + B62.indexOf(ch); return v/1e7 - 200; }
  return +s;
}
function parseNaverPoint(seg){
  const parts = decodeURIComponent(seg).split(',');
  const ll = toLL(naverNum(parts[0]), naverNum(parts[1])); if (!ll) return null;
  const name = (parts[2] || '').trim();
  return { lat:ll.lat, lng:ll.lng, name: name || `네이버 경로 지점 (${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)})` };
}
function parseNaverRoute(text){
  text = String(text||'').trim(); if (!text) return null;
  let url; try { url = new URL(text.replace(/^nmap:\/\//, 'https://nmap.local/')); } catch(e){ return null; }
  const q = url.searchParams, pts = [];
  // 1) map.naver.com/.../directions/출발/도착/경유/방식
  const m = url.pathname.match(/\/directions\/(.+)$/);
  if (m) {
    const segs = m[1].split('/').filter(Boolean);
    const start = segs[0] && parseNaverPoint(segs[0]);
    const goal = segs[1] && parseNaverPoint(segs[1]);
    const vias = segs[2] && segs[2] !== '-' ? segs[2].split(/[:~]/).map(parseNaverPoint).filter(Boolean) : [];
    if (start && goal) return [start, ...vias, goal];
  }
  // 2) 앱 주소 nmap://route/car?slat=…&slng=…&dlat=…&dlng=…&v1lat=…
  if (q.get('slat') && q.get('dlat')) {
    const P = (a,b,n) => { const ll = toLL(q.get(b), q.get(a)); return ll ? { ...ll, name:q.get(n) || '네이버 경로 지점' } : null; };
    pts.push(P('slat','slng','sname'));
    for (let i = 1; i <= 5; i++) if (q.get(`v${i}lat`)) pts.push(P(`v${i}lat`,`v${i}lng`,`v${i}name`));
    pts.push(P('dlat','dlng','dname'));
    if (pts.every(Boolean)) return pts;
  }
  // 3) 모바일 웹 m.map.naver.com/route.nhn?sx=…&sy=…&ex=…&ey=…
  if (q.get('sx') && q.get('ex')) {
    const P = (x,y,n) => { const ll = toLL(q.get(x), q.get(y)); return ll ? { ...ll, name:q.get(n) || '네이버 경로 지점' } : null; };
    const out = [P('sx','sy','sname')];
    for (let i = 1; i <= 5; i++) if (q.get(`v${i}x`) || q.get(`wx${i}`)) out.push(P(q.get(`v${i}x`)?`v${i}x`:`wx${i}`, q.get(`v${i}y`)?`v${i}y`:`wy${i}`, `v${i}name`));
    out.push(P('ex','ey','ename'));
    if (out.every(Boolean)) return out;
  }
  return null;
}
function applyNaverRoute(){
  const raw = $('#rbNaver').value.trim(); if (!raw) return;
  if (/naver\.me\//.test(raw)) { $('#rbInfo').textContent = 'naver.me 짧은 주소는 바로 읽을 수 없어요. 그 주소를 한 번 열고, 주소창의 긴 주소(map.naver.com/…)를 복사해 넣어 주세요.'; return; }
  const pts = parseNaverRoute(raw);
  if (!pts) { $('#rbInfo').textContent = '이 주소에서 출발지·도착지를 찾지 못했어요. 네이버 지도 "길찾기" 화면의 주소인지 확인해 주세요.'; return; }
  route.pts = pts; routeRenderPts(); routeCompute();
  toast(`네이버 경로를 불러왔어요 · ${pts.length}개 지점`);
}
$('#rbNaverGo').addEventListener('click', applyNaverRoute);
$('#rbNaver').addEventListener('keydown', e => { if (e.key === 'Enter') applyNaverRoute(); });
$('#rbNaver').addEventListener('paste', () => setTimeout(applyNaverRoute, 30)); // 붙여넣으면 바로 적용

// ---------- 돌발상황: 부산시(키·호출 제한 없음, 3분마다 갱신) + 고속도로·국도(인증키, 켤 때·새로고침 때만) ----------
const inc = { on:true, busan:[], nat:[], layer:null, timer:null, card:null, loadedAt:null };
try { inc.on = localStorage.getItem(KEY+'-incOn') !== '0'; } catch(e){}
const unesc = s => { let t = String(s||''); for (let i = 0; i < 3 && /&[a-z#0-9]+;/i.test(t); i++) { const ta = document.createElement('textarea'); ta.innerHTML = t; t = ta.value; } return t.trim(); };
function incColor(type){ return /사고|고장|낙하|화재|추돌/.test(type) ? '#e03131' : /공사|작업|통제|차단/.test(type) ? '#f08c00' : /기상|강설|결빙|안개|침수/.test(type) ? '#1c7ed6' : '#868e96'; }
const incAll = () => inc.busan.concat(inc.nat);
function incInit(){
  inc.layer = L.layerGroup(); if (inc.on) inc.layer.addTo(map);
  const ctl = L.control({ position:'topleft' });
  ctl.onAdd = () => { const b = L.DomUtil.create('button','inc-toggle'); L.DomEvent.disableClickPropagation(b);
    b.onclick = e => { if (e.target.classList.contains('rf')) { incLoadBusan(); if (natOn) incLoadNat(true); toast('돌발상황 새로고침'); return; } incSetOn(!inc.on); }; return b; };
  ctl.addTo(map); incPaintBtn();
  if (inc.on) incLoadBusan();
  if (inc.on && natOn) incLoadNat();
  inc.timer = setInterval(() => { if (inc.on) incLoadBusan(); }, 3*60e3);
}
function incPaintBtn(){ const b = document.querySelector('.inc-toggle'); if (!b) return; const n = incAll().length;
  b.classList.toggle('on', inc.on); b.innerHTML = `⚠ 돌발상황 ${inc.on ? (n ? n+'건' : '켬') : '끔'}${inc.on ? '<span class="rf" title="새로고침">↻</span>' : ''}`;
  b.title = inc.on ? `부산시는 3분마다 자동 갱신${inc.loadedAt ? ' · 마지막 ' + inc.loadedAt : ''}${natOn ? ' · 고속도로·국도는 ↻ 누를 때 갱신' : ''}` : '돌발상황 표시'; }
function incSetOn(on){ inc.on = on; try { localStorage.setItem(KEY+'-incOn', on ? '1' : '0'); } catch(e){}
  if (on) { inc.layer.addTo(map); incLoadBusan(); if (natOn) incLoadNat(); } else { inc.layer.remove(); incCloseCard(); }
  incPaintBtn(); }
async function incLoadBusan(){
  try {
    const j = await fetch('https://its.busan.go.kr/api-n/v1/bsits/user/incs/map').then(r => r.json());
    const a = Array.isArray(j) ? j : (j.data || Object.values(j).find(Array.isArray) || []);
    inc.busan = a.filter(x => x.lat && x.lot).map(x => ({ id:'b'+x.incId, src:'busan', lat:+x.lat, lng:+x.lot, type:x.incTypeNm || '돌발', place:x.incSpotNm || '',
      msg:unesc(x.rcptCn || x.incCn), time:x.ocrnDt || '', status:x.prgrsSttsNm || '', block:'', cctv:x.nearestCctvId, cctvName:x.nearestCctvInstlPos, cctvDist:x.nearestCctvDistanceMeter }));
    inc.loadedAt = new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
  } catch(e){}
  incDraw();
}
async function incLoadNat(force){
  if (!ITS_KEY) return;
  if (!force && inc.nat.length) { incDraw(); return; }
  try {
    const b = map.getBounds().pad(0.5);
    const u = `https://openapi.its.go.kr:9443/eventInfo?apiKey=${ITS_KEY}&type=all&eventType=all&minX=${b.getWest().toFixed(4)}&maxX=${b.getEast().toFixed(4)}&minY=${b.getSouth().toFixed(4)}&maxY=${b.getNorth().toFixed(4)}&getType=json`;
    const j = await fetch(u).then(r => r.json()); const d = (j.body && j.body.items) || [];
    incDrawNat(d.filter(x => x.coordX && x.coordY).map((x,i) => ({ id:'n'+i+'_'+x.coordX+'_'+x.coordY, src:'nat', lat:+x.coordY, lng:+x.coordX,
      type:x.eventDetailType || x.eventType || '돌발', place:(x.roadName ? `[${x.type}] ${x.roadName}` : x.type) + (x.roadDrcType ? ` (${x.roadDrcType} 방향)` : ''),
      msg:unesc(x.message), time:x.startDate ? x.startDate.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2}).*/, '$1-$2-$3 $4:$5') : '', status:'', block:x.lanesBlocked || '' })));
  } catch(e){ toast('고속도로·국도 돌발상황을 받지 못했어요.'); }
}
function incDrawNat(list){ inc.nat = list; incDraw(); }
function incDraw(){
  if (!inc.layer) return; inc.layer.clearLayers();
  incAll().forEach(x => {
    const m = L.marker([x.lat, x.lng], { zIndexOffset:900, icon:L.divIcon({ className:'', html:`<div class="inc-ico" style="background:${incColor(x.type)}">!</div>`, iconSize:[22,22], iconAnchor:[11,11] }) }).addTo(inc.layer);
    m.on('click', () => incOpenCard(x, m));
    m.on('mouseover', e => { if (!isTouch(e)) incOpenCard(x, m); });
  });
  incPaintBtn();
}
function nearestCctv(x){
  if (x.cctv && byId(x.cctv)) return byId(x.cctv);
  let best = null, bd = Infinity;
  all.concat([...nat.values()].filter(c => c.lat)).forEach(c => { const d = Math.hypot((c.lot-x.lng)*91000, (c.lat-x.lat)*111000); if (d < bd) { bd = d; best = c; } });
  return bd < 3000 ? Object.assign(best, { _dist:bd }) : null;
}
function incOpenCard(x, m){
  incCloseCard(); closePreview();
  const c = nearestCctv(x), dist = x.cctvDist || (c && c._dist);
  const el = document.createElement('div'); el.className = 'inc-card';
  el.innerHTML = `<div class="t"><span class="badge" style="background:${incColor(x.type)}">${x.type}</span><span class="pl">${x.place}</span><button class="x" title="닫기">✕</button></div>
    ${x.msg ? `<div class="msg">${x.msg.replace(/</g,'&lt;')}</div>` : ''}
    <div class="meta">${[x.time && '발생 ' + x.time, x.status, x.block, x.src === 'busan' ? '부산시 교통정보' : '국가교통정보센터'].filter(Boolean).join(' · ')}</div>
    <div class="bt">${c ? `<button class="primary" data-a="cctv">가까운 CCTV 보기 · ${c.instlPos}${dist ? ` (${Math.round(dist)}m)` : ''}</button>` : '<span class="meta">근처 3km 안에 CCTV가 없어요</span>'}${naverBtn({ lat:x.lat, lot:x.lng })}</div>`;
  document.body.appendChild(el); inc.card = el;
  const r = $('#map').getBoundingClientRect(), pt = map.latLngToContainerPoint(m.getLatLng());
  let left = r.left + pt.x - 140, top = r.top + pt.y - el.offsetHeight - 16; if (top < 8) top = r.top + pt.y + 16;
  el.style.left = Math.max(8, Math.min(innerWidth - 288, left)) + 'px'; el.style.top = Math.max(8, Math.min(innerHeight - el.offsetHeight - 8, top)) + 'px';
  el.addEventListener('click', e => { e.stopPropagation();
    if (e.target.classList.contains('x')) incCloseCard();
    if (e.target.closest('[data-a=cctv]')) { incCloseCard(); openLoc(c); } });
  el.addEventListener('mouseleave', () => { if (!hoverNone) inc.cardTimer = setTimeout(incCloseCard, 400); });
  el.addEventListener('mouseenter', () => clearTimeout(inc.cardTimer));
  m.once('mouseout', e => { if (!isTouch(e)) inc.cardTimer = setTimeout(incCloseCard, 400); });
}
function incCloseCard(){ clearTimeout(inc.cardTimer); if (inc.card) { inc.card.remove(); inc.card = null; } }

init();
</script>
